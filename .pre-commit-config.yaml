ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master', '--branch', '/^release\/.+/']

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ['--disable', 'MD013', 'MD033', 'MD041']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  - repo: local
    hooks:
      - id: gate-truth-table
        name: verify the Test gate cannot go green on a red prerequisite
        entry: pytest tests/gate-truth-table.py
        language: system
        pass_filenames: false
        files: '(\.github/workflows/pr-check-and-test\.yml|tests/gate-truth-table\.py)$'

      - id: bump-version-derivation
        name: verify the version bump cannot roll a release back
        entry: pytest tests/bump-version-derivation.py
        language: system
        pass_filenames: false
        files: '(\.github/workflows/pr-check-and-bump\.yml|tests/bump-version-derivation\.py)$'

      - id: bump-type-selection
        name: verify a mixed feat and fix PR cannot be downgraded to a patch bump
        entry: pytest tests/bump-type-selection.py
        language: system
        pass_filenames: false
        files: '(\.github/workflows/pr-check-and-bump\.yml|tests/bump-type-selection\.py)$'

      - id: validate-actions
        name: verify composite action metadata resolves to real steps
        entry: pytest tests/validate-actions.py
        language: system
        pass_filenames: false
        files: '(\.github/actions/.*/action\.yml|tests/validate-actions\.py)$'

      - id: detect-technology
        name: verify technology detection pins the primary consumer vocabulary
        entry: pytest tests/detect-technology.py
        language: system
        pass_filenames: false
        files: '(\.github/actions/detect-technology/action\.yml|tests/detect-technology\.py)$'

      - id: release-github-floating-tag
        name: verify the release floating major tag derives from the created tag
        entry: pytest tests/release-github-floating-tag.py
        language: system
        pass_filenames: false
        files: '(\.github/actions/release-github/action\.yml|tests/release-github-floating-tag\.py)$'

      - id: version-authority
        name: verify bump-version stays the single version authority
        entry: pytest tests/version-authority.py
        language: system
        pass_filenames: false
        files: '(^\.github/workflows/release(-github)?\.yml|^\.github/actions/release-github/action\.yml|^\.github/workflows/pr-check-and-bump\.yml|^\.github/actions/bump-version/action\.yml|^VERSION$|tests/version-authority\.py)$'

      - id: bump-guard-state
        name: verify the bump guard detects an applied bump from PR state, not the last commit message
        entry: pytest tests/bump-guard-state.py
        language: system
        pass_filenames: false
        files: '(\.github/workflows/pr-check-and-bump\.yml|tests/bump-guard-state\.py)$'

      - id: validate-branch
        name: verify branch validation accepts allowed patterns and rejects invalid ones
        entry: pytest tests/validate-branch.py
        language: system
        pass_filenames: false
        files: '(\.github/actions/validate-branch/action\.yml|tests/validate-branch\.py)$'

      - id: parse-conventional-commits
        name: verify conventional commit parser derives the correct bump type
        entry: pytest tests/parse-conventional-commits.py
        language: system
        pass_filenames: false
        files: '(\.github/actions/parse-conventional-commits/action\.yml|tests/parse-conventional-commits\.py)$'

      - id: resolve-base-version
        name: verify base version resolution prefers files then highest release tag
        entry: pytest tests/resolve-base-version.py
        language: system
        pass_filenames: false
        files: '(\.github/actions/resolve-base-version/action\.yml|tests/resolve-base-version\.py)$'

      - id: check-already-bumped
        name: verify the already-bumped guard compares PR head to base release tag
        entry: pytest tests/check-already-bumped.py
        language: system
        pass_filenames: false
        files: '(\.github/actions/check-already-bumped/action\.yml|tests/check-already-bumped\.py)$'

      - id: validate-action-structure
        name: verify action.yml structure validation rejects invalid metadata
        entry: pytest tests/validate-action-structure.py
        language: system
        pass_filenames: false
        files: '(\.github/actions/validate-action-structure/action\.yml|tests/validate-action-structure\.py)$'

      - id: install-actionlint
        name: verify actionlint installer downloads the requested version
        entry: pytest tests/install-actionlint.py
        language: system
        pass_filenames: false
        files: '(\.github/actions/install-actionlint/action\.yml|tests/install-actionlint\.py)$'

      - id: run-tox
        name: verify run-tox uses mise and runs tox
        entry: pytest tests/run-tox.py
        language: system
        pass_filenames: false
        files: '(tox\.ini|\.github/actions/run-tox/action\.yml|tests/run-tox\.py)$'

      - id: run-pre-commit
        name: verify run-pre-commit uses mise and runs all hooks
        entry: pytest tests/run-pre-commit.py
        language: system
        pass_filenames: false
        files: '(mise\.toml|\.github/actions/run-pre-commit/action\.yml|tests/run-pre-commit\.py)$'

      - id: self-bump-branch-pattern
        name: verify self-bump admits Dependabot branches and still bumps them
        entry: pytest tests/self-bump-branch-pattern.py
        language: system
        pass_filenames: false
        files: '(\.github/workflows/self-bump\.yml|\.github/workflows/pr-check-and-bump\.yml|tests/self-bump-branch-pattern\.py)$'

      - id: select-pre-release-artifacts
        name: verify pre-release artifact selector only accepts binary artifacts
        entry: pytest tests/select-pre-release-artifacts.py
        language: system
        pass_filenames: false
        files: '(\.github/actions/select-pre-release-artifacts/action\.yml|\.github/workflows/pr-check-and-test\.yml|tests/select-pre-release-artifacts\.py)$'

      - id: verify-required-tests-passed
        name: verify the required-test gate cannot go green on a failing job
        entry: pytest tests/verify-required-tests-passed.py
        language: system
        pass_filenames: false
        files: '(\.github/actions/verify-required-tests-passed/action\.yml|\.github/workflows/pr-check-and-test\.yml|tests/verify-required-tests-passed\.py)$'

      - id: local-action-refs
        name: verify reusable workflows reference their own actions via $/ not ./
        entry: pytest tests/local-action-refs.py
        language: system
        pass_filenames: false
        files: '(\.github/workflows/.*\.ya?ml|tests/local-action-refs\.py)$'
