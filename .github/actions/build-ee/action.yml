name: 'Build Execution Environment'
description: 'Builds Ansible Execution Environment image using ansible-builder'
inputs:
  version:
    description: 'Version to tag the image'
    required: true
  image-name:
    description: 'Image name (default: repo name)'
    required: false
    default: ''
  ee-definition-file:
    description: 'Path to execution-environment.yml'
    required: false
    default: 'execution-environment.yml'
  additional-tags:
    description: 'Additional tags (comma-separated)'
    required: false
    default: 'latest'
outputs:
  image-tag:
    description: 'Full image tag with version'
    value: ${{ steps.build.outputs.image-tag }}
  image-name:
    description: 'Image name'
    value: ${{ steps.build.outputs.image-name }}
runs:
  using: composite
  steps:
    - name: Setup Ansible Builder
      shell: bash
      run: pip install ansible-builder
    - name: Build EE image
      id: build
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        IMAGE_NAME="${{ inputs.image-name }}"
        
        if [ -z "$IMAGE_NAME" ]; then
          IMAGE_NAME="${{ github.repository }}"
        elif ! echo "$IMAGE_NAME" | grep -q '/'; then
          IMAGE_NAME="${{ github.repository_owner }}/$IMAGE_NAME"
        fi
        
        IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
        FULL_TAG="ghcr.io/$IMAGE_NAME:$VERSION"
        
        ansible-builder build \
          --file "${{ inputs.ee-definition-file }}" \
          --container-runtime docker \
          --tag "$FULL_TAG" \
          --tag "ghcr.io/$IMAGE_NAME:latest"
        
        IFS=',' read -ra TAGS <<< "${{ inputs.additional-tags }}"
        for tag in "${TAGS[@]}"; do
          tag=$(echo "$tag" | tr -d ' ')
          if [ -n "$tag" ]; then
            ADDITIONAL_TAG="ghcr.io/$IMAGE_NAME:$tag"
            docker tag "$FULL_TAG" "$ADDITIONAL_TAG"
            echo "Tagged: $ADDITIONAL_TAG"
          fi
        done
        
        echo "image-tag=$FULL_TAG" >> "$GITHUB_OUTPUT"
        echo "image-name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
        echo "✅ Built EE image: $FULL_TAG"
    - name: Save Docker image
      shell: bash
      run: |
        FULL_TAG="${{ steps.build.outputs.image-tag }}"
        docker save "$FULL_TAG" -o docker-image.tar
        echo "✅ Saved EE image to docker-image.tar"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: docker-image.tar
        retention-days: 7
