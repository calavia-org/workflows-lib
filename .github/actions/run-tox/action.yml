name: Run tox
branding:
  icon: check-circle
  color: green
description: |
  Installs mise, resolves the Python version from mise.toml, installs tox, and
  runs the configured tox environments. Used for the Python version matrix in CI.
inputs:
  args:
    description: 'Extra arguments passed to tox'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install mise and tools
      uses: jdx/mise-action@v2

    - name: Install tox
      shell: bash
      run: |
        # The mise-provided Python is externally managed (PEP 668), so install
        # tox into a local venv rather than the system/managed environment.
        mise exec -- python -m venv .venv-tox
        .venv-tox/bin/pip install --upgrade pip
        .venv-tox/bin/pip install tox

    - name: Run tox
      shell: bash
      run: |
        .venv-tox/bin/tox ${{ inputs.args }}
