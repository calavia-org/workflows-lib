name: 'Build Docker'
description: 'Builds Docker image from Dockerfile'
inputs:
  version:
    description: 'Version to tag the image'
    required: true
  image-name:
    description: 'Image name (default: repo name)'
    required: false
    default: ''
  dockerfile-path:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
  build-context:
    description: 'Build context'
    required: false
    default: '.'
  binary-artifact:
    description: 'Path to binary artifact to include'
    required: false
    default: ''
  additional-tags:
    description: 'Additional tags (comma-separated)'
    required: false
    default: 'latest'
outputs:
  image-tag:
    description: 'Full image tag with version'
    value: ${{ steps.build.outputs.image-tag }}
  image-name:
    description: 'Image name'
    value: ${{ steps.build.outputs.image-name }}
runs:
  using: composite
  steps:
    - name: Download binary artifact
      if: inputs.binary-artifact != ''
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.binary-artifact }}
        path: ./artifact
    - name: Build Docker image
      id: build
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        IMAGE_NAME="${{ inputs.image-name }}"
        
        if [ -z "$IMAGE_NAME" ]; then
          IMAGE_NAME="${{ github.repository }}"
        elif ! echo "$IMAGE_NAME" | grep -q '/'; then
          IMAGE_NAME="${{ github.repository_owner }}/$IMAGE_NAME"
        fi
        
        IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
        FULL_TAG="ghcr.io/$IMAGE_NAME:$VERSION"
        
        docker build -f ${{ inputs.dockerfile-path }} -t "$FULL_TAG" ${{ inputs.build-context }}
        
        IFS=',' read -ra TAGS <<< "${{ inputs.additional-tags }}"
        for tag in "${TAGS[@]}"; do
          tag=$(echo "$tag" | tr -d ' ')
          if [ -n "$tag" ]; then
            ADDITIONAL_TAG="ghcr.io/$IMAGE_NAME:$tag"
            docker tag "$FULL_TAG" "$ADDITIONAL_TAG"
            echo "Tagged: $ADDITIONAL_TAG"
          fi
        done
        
        echo "image-tag=$FULL_TAG" >> "$GITHUB_OUTPUT"
        echo "image-name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
        echo "✅ Built image: $FULL_TAG"
    - name: Save Docker image
      shell: bash
      run: |
        FULL_TAG="${{ steps.build.outputs.image-tag }}"
        docker save "$FULL_TAG" -o docker-image.tar
        echo "✅ Saved image to docker-image.tar"
    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: docker-image
        path: docker-image.tar
        retention-days: 7
