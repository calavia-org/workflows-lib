name: 'Scan Dependencies'
description: 'Installs Google OSV-Scanner and scans lockfiles for known vulnerable dependencies, producing SARIF and blocking on findings.'

inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  severity:
    description: 'Minimum severity to fail on (HIGH, MEDIUM, LOW). OSV-Scanner does not natively filter by severity; this input is reserved for future filtering and does not change behavior today.'
    required: false
    default: 'HIGH'
  upload-sarif:
    description: 'Upload the SARIF report to the GitHub Security tab'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for SARIF upload'
    required: false
    default: '${{ github.token }}'
  extra-args:
    description: 'Extra arguments passed to the OSV-Scanner CLI'
    required: false
    default: ''
  offline-vulnerabilities:
    description: 'Use a cached local OSV database for vulnerability matching instead of querying the OSV API per package'
    required: false
    default: 'true'
  db-cache-dir:
    description: 'Directory used by OSV-Scanner for the local vulnerability database cache'
    required: false
    default: '~/.cache/osv-scanner'

outputs:
  sarif-path:
    description: 'Path to the generated SARIF file'
    value: ${{ steps.scan.outputs.sarif-path }}
  findings:
    description: 'Number of findings reported'
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: composite
  steps:
    - name: Install OSV-Scanner
      shell: bash
      run: |
        set -euo pipefail
        if command -v osv-scanner >/dev/null 2>&1; then
          echo "OSV-Scanner already installed: $(osv-scanner --version)"
          exit 0
        fi
        echo "Installing OSV-Scanner..."
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ASSET_ARCH="amd64" ;;
          aarch64|arm64) ASSET_ARCH="arm64" ;;
          *) echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
        esac
        curl -sSL "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_${ASSET_ARCH}" \
          -o /usr/local/bin/osv-scanner
        chmod +x /usr/local/bin/osv-scanner
        echo "Installed: $(osv-scanner --version)"

    # The database is keyed by ISO week rather than by run: OSV publishes new
    # advisories continuously, but a per-run key would force a full database
    # download on every scan. A cache hit reuses the week's snapshot and the scan
    # step only requests a download on a miss.
    - name: Resolve OSV database cache key
      id: db-key
      shell: bash
      run: |
        set -euo pipefail
        week=$(date -u +%Y-%W)
        echo "week=$week" >> "$GITHUB_OUTPUT"

    - name: Cache OSV database
      id: db-cache
      if: ${{ inputs.offline-vulnerabilities == 'true' }}
      uses: actions/cache@v4
      with:
        path: ${{ inputs.db-cache-dir }}
        key: osv-db-${{ runner.os }}-${{ steps.db-key.outputs.week }}

    - name: Scan dependencies
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        OFFLINE_VULNERABILITIES: ${{ inputs.offline-vulnerabilities }}
        DB_CACHE_DIR: ${{ inputs.db-cache-dir }}
        DB_CACHE_HIT: ${{ steps.db-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        SARIF="osv-scanner-results.sarif"
        echo "Scanning $SCAN_PATH for vulnerable dependencies..."
        # OSV-Scanner exits non-zero when vulnerabilities are found, so we continue
        # to capture the SARIF file and then decide whether to fail the step.
        OSV_ARGS=()
        DB_DOWNLOADED="false"
        if [ "$OFFLINE_VULNERABILITIES" = "true" ]; then
          # The input is literal text, so the shell will not expand a leading ~.
          DB_DIR="${DB_CACHE_DIR/#\~/${HOME}}"
          export OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY="$DB_DIR"
          OSV_ARGS+=(--offline-vulnerabilities)
          # A cache hit already holds this week's database. Only a miss downloads,
          # because --offline-vulnerabilities alone matches from the local copy;
          # without it the scanner queries the OSV API per package.
          if [ "$DB_CACHE_HIT" != "true" ]; then
            OSV_ARGS+=(--download-offline-databases)
            DB_DOWNLOADED="true"
          fi
        fi
        echo "Offline vulnerability matching: $OFFLINE_VULNERABILITIES (database downloaded this run: $DB_DOWNLOADED)"
        read -ra extra_args <<< "$EXTRA_ARGS"
        osv-scanner \
          --format sarif \
          --output-file "$SARIF" \
          --recursive \
          "${OSV_ARGS[@]}" \
          "${extra_args[@]}" \
          "$SCAN_PATH" || true
        if [ ! -f "$SARIF" ]; then
          # If the repo has no supported lockfile/manifest, the scanner exits
          # before writing SARIF. Treat that as zero findings rather than a
          # failure, but fail if a supported source exists and still no report.
          SUPPORTED_LOCKFILES=(
            "package-lock.json" "yarn.lock" "pnpm-lock.yaml"
            "requirements.txt" "Pipfile.lock" "poetry.lock" "uv.lock"
            "go.mod" "go.sum" "Cargo.lock" "Gemfile.lock" "composer.lock"
            "packages.lock.json" "project.assets.json"
            "pom.xml" "build.gradle" "build.gradle.kts" "gradle.lockfile"
            "pubspec.lock" "mix.lock" "pdm.lock" "renv.lock" "flake.lock"
            "buf.lock" "osv-scanner.toml"
          )
          FOUND=0
          for f in "${SUPPORTED_LOCKFILES[@]}"; do
            if [ -f "$f" ]; then
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No supported dependency lockfiles found; treating as zero findings."
            echo '{"version": "2.1.0", "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json", "runs": [{"tool": {"driver": {"name": "osv-scanner", "informationUri": "https://github.com/google/osv-scanner"}}, "results": []}]}' > "$SARIF"
          else
            echo "::error::OSV-Scanner did not produce a SARIF file"
            exit 1
          fi
        fi
        COUNT=$(python3 -c "import json; print(len(json.load(open('$SARIF')).get('results', [])))" 2>/dev/null || echo "0")
        echo "Findings: $COUNT"
        echo "sarif-path=$SARIF" >> "$GITHUB_OUTPUT"
        echo "findings=$COUNT" >> "$GITHUB_OUTPUT"
        if [ "$COUNT" -ne 0 ]; then
          echo "::error::$COUNT vulnerable dependency(ies) detected. See the SARIF report in the GitHub Security tab."
          exit 1
        fi
        echo "✅ No OSV-Scanner findings."

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-path }}
        category: osv-scanner-dependencies
        token: ${{ inputs.github-token }}
