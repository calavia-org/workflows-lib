name: 'Scan Secrets'
description: 'Installs TruffleHog and scans the repository for leaked secrets, producing SARIF and blocking on verified findings.'

inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  severity:
    description: 'Minimum severity to fail on (HIGH, MEDIUM, LOW). TruffleHog only supports verified/unverified; this input is reserved for future filtering and does not change behavior today.'
    required: false
    default: 'HIGH'
  upload-sarif:
    description: 'Upload the SARIF report to the GitHub Security tab'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for SARIF upload'
    required: false
    default: '${{ github.token }}'
  extra-args:
    description: 'Extra arguments passed to the TruffleHog CLI'
    required: false
    default: ''

outputs:
  sarif-path:
    description: 'Path to the generated SARIF file'
    value: ${{ steps.scan.outputs.sarif-path }}
  findings:
    description: 'Number of findings reported'
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: composite
  steps:
    - name: Install TruffleHog
      shell: bash
      run: |
        set -euo pipefail
        if command -v trufflehog >/dev/null 2>&1; then
          echo "TruffleHog already installed: $(trufflehog --version)"
          exit 0
        fi
        echo "Installing TruffleHog..."
        curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
          | sh -s -- -b /usr/local/bin
        echo "Installed: $(trufflehog --version)"

    - name: Scan for secrets
      id: scan
      shell: bash
      run: |
        set -euo pipefail
        SARIF="trufflehog-results.sarif"
        echo "Scanning ${{ inputs.path }} for secrets..."
        # --fail exits non-zero when verified secrets are found, which blocks the PR.
        # TruffleHog v3 writes SARIF to stdout when passed --sarif; redirect it to
        # the report file and continue so we can count findings and upload.
        trufflehog git "file://${{ inputs.path }}" \
          --results=verified \
          --sarif \
          --fail \
          ${{ inputs.extra-args }} > "$SARIF" || true
        # TruffleHog writes the SARIF file even when findings exist.
        if [ ! -f "$SARIF" ]; then
          echo "::error::TruffleHog did not produce a SARIF file"
          exit 1
        fi
        COUNT=$(python3 -c "import json; print(len(json.load(open('$SARIF')).get('results', [])))" 2>/dev/null || echo "0")
        echo "Findings: $COUNT"
        echo "sarif-path=$SARIF" >> "$GITHUB_OUTPUT"
        echo "findings=$COUNT" >> "$GITHUB_OUTPUT"
        if [ "$COUNT" -ne 0 ]; then
          echo "::error::$COUNT verified secret(s) detected. See the SARIF report in the GitHub Security tab."
          exit 1
        fi
        echo "✅ No verified secrets found."

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-path }}
        category: trufflehog-secrets
        token: ${{ inputs.github-token }}
