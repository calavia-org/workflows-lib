name: Run pre-commit
branding:
  icon: check-circle
  color: blue
description: |
  Installs mise, resolves the Python version from mise.toml, installs pre-commit,
  and runs the configured hooks. Intended for CI runners where network access is
  available, unlike pre-commit.ci.
inputs:
  all-files:
    description: 'Run hooks on all files instead of only changed files'
    required: false
    default: 'true'
  args:
    description: 'Extra arguments passed to pre-commit run'
    required: false
    default: ''
  custom-config:
    description: 'Path to a custom pre-commit config file'
    required: false
    default: ''
  fail-on-missing:
    description: 'Fail if no pre-commit config is found'
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Check for pre-commit config
      id: detect-config
      shell: bash
      run: |
        CONFIG_PATH=""
        if [ -n "${{ inputs.custom-config }}" ] && [ -f "${{ inputs.custom-config }}" ]; then
          CONFIG_PATH="${{ inputs.custom-config }}"
        elif [ -f ".pre-commit-config.yaml" ]; then
          CONFIG_PATH=".pre-commit-config.yaml"
        elif [ -f ".pre-commit-config.yml" ]; then
          CONFIG_PATH=".pre-commit-config.yml"
        fi

        if [ -n "$CONFIG_PATH" ]; then
          echo "config_found=true" >> "$GITHUB_OUTPUT"
          echo "config_path=$CONFIG_PATH" >> "$GITHUB_OUTPUT"
          echo "Found pre-commit config: $CONFIG_PATH"
        else
          echo "config_found=false" >> "$GITHUB_OUTPUT"
          echo "No pre-commit config found"
          if [ "${{ inputs.fail-on-missing }}" == "true" ]; then
            exit 1
          fi
        fi

    - name: Install mise and tools
      if: steps.detect-config.outputs.config_found == 'true'
      uses: jdx/mise-action@v5

    # pre-commit builds a fresh environment for every managed hook (actionlint
    # = Go, markdownlint = Node, the rest = Python) on each run; restoring this
    # directory skips those builds. The key hashes the config file, so a hook rev
    # change rebusts; pre-commit itself rebuilds any env whose repo/rev is absent
    # from the cache, so a stale restore degrades to a partial rebuild rather
    # than a wrong result. Local `language: system` hooks use no env here.
    - name: Cache pre-commit environments
      if: steps.detect-config.outputs.config_found == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.pre-commit-config.yml', inputs.custom-config) }}

    - name: Install pre-commit and test dependencies
      if: steps.detect-config.outputs.config_found == 'true'
      shell: bash
      run: |
        # The mise-provided Python is externally managed (PEP 668), so install
        # pre-commit into a local venv rather than the system/managed environment.
        mise exec -- python -m venv .venv
        .venv/bin/pip install --upgrade pip
        .venv/bin/pip install pre-commit
        # Install the repo's own packaging + `test` extra so any local
        # `language: system` hooks can resolve local imports. Only repos WITH
        # packaging metadata can be installed editable; bare Ansible collections
        # and other non-Python repos have none, and an unconditional
        # `pip install -e ".[test]"` fails the whole job there.
        if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
          .venv/bin/pip install -e ".[test]"
        else
          echo "No pyproject.toml/setup.py/setup.cfg at repo root; skipping editable install."
        fi

    - name: Run pre-commit
      if: steps.detect-config.outputs.config_found == 'true'
      shell: bash
      run: |
        if [ "${{ inputs.all-files }}" == "true" ]; then
          ALL_FILES="--all-files"
        else
          ALL_FILES=""
        fi

        # Make the venv tools (pre-commit, pytest, repo package) available to
        # system-language pre-commit hooks that spawn subprocesses.
        export PATH="$PWD/.venv/bin:$PATH"
        pre-commit run $ALL_FILES --show-diff-on-failure ${{ inputs.args }}
