name: 'Scan SAST'
description: 'Installs Semgrep and runs static application security testing, producing SARIF and blocking on findings.'

inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  severity:
    description: 'Minimum severity to fail on (HIGH, MEDIUM, LOW)'
    required: false
    default: 'HIGH'
  upload-sarif:
    description: 'Upload the SARIF report to the GitHub Security tab'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for SARIF upload'
    required: false
    default: '${{ github.token }}'
  extra-args:
    description: 'Extra arguments passed to the Semgrep CLI'
    required: false
    default: ''
  semgrep-version:
    description: 'Pinned Semgrep version to install (also pins the venv cache key)'
    required: false
    default: '1.181.0'
  diff-scan:
    description: 'Scan only files changed since baseline-ref (diff-aware). Off by default: a diff scan cannot see pre-existing findings in untouched files.'
    required: false
    default: 'false'
  baseline-ref:
    description: 'Git ref to diff against when diff-scan is true; the merge-base with this ref is the baseline'
    required: false
    default: ''

outputs:
  sarif-path:
    description: 'Path to the generated SARIF file'
    value: ${{ steps.scan.outputs.sarif-path }}
  findings:
    description: 'Number of findings reported'
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: composite
  steps:
    # The venv key pins the Semgrep version, so a version bump invalidates the
    # cache instead of silently serving a stale engine. Restoring the venv saves
    # the ~19s `python3 -m venv` + `pip install semgrep` on every run. When the
    # version is left empty (unpinned), the cache is skipped: a constant key
    # would freeze the first-installed engine forever.
    - name: Cache Semgrep venv
      if: ${{ inputs.semgrep-version != '' }}
      uses: actions/cache@v6
      with:
        path: .venv-semgrep
        key: semgrep-venv-${{ runner.os }}-${{ inputs.semgrep-version }}

    - name: Install Semgrep
      shell: bash
      run: |
        set -euo pipefail
        SEMGREP_VERSION="${{ inputs.semgrep-version }}"
        if command -v semgrep >/dev/null 2>&1; then
          echo "Semgrep already installed: $(semgrep --version)"
          exit 0
        fi
        if [ -x .venv-semgrep/bin/semgrep ]; then
          echo "$PWD/.venv-semgrep/bin" >> "$GITHUB_PATH"
          echo "Restored Semgrep venv: $(.venv-semgrep/bin/semgrep --version)"
          exit 0
        fi
        echo "Installing Semgrep $SEMGREP_VERSION into a local venv..."
        python3 -m venv .venv-semgrep
        .venv-semgrep/bin/pip install --quiet "semgrep==$SEMGREP_VERSION"
        echo "$PWD/.venv-semgrep/bin" >> "$GITHUB_PATH"
        echo "Installed: $(.venv-semgrep/bin/semgrep --version)"

    # Rule packs are fetched fresh every run (~5s). A run-id key saves a new
    # snapshot each run while restore-keys always pulls the most recent one, so
    # the cache stays warm without freezing upstream registry rules.
    - name: Cache Semgrep rule packs
      uses: actions/cache@v6
      with:
        path: .semgrep-cache
        key: semgrep-rules-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          semgrep-rules-${{ runner.os }}-

    - name: Run Semgrep
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SEVERITY: ${{ inputs.severity }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        DIFF_SCAN: ${{ inputs.diff-scan }}
        BASELINE_REF: ${{ inputs.baseline-ref }}
        # Cache of downloaded rule packs; rotated by run id so stale registry
        # rules never persist across runs (a static key would freeze p/ci).
        SEMGREP_CACHE_DIR: ${{ github.workspace }}/.semgrep-cache
      run: |
        set -euo pipefail
        SARIF="semgrep-results.sarif"
        SEVERITY_FLAGS=()
        case "${SEVERITY^^}" in
          HIGH|CRITICAL)
            SEVERITY_FLAGS=(--severity ERROR)
            ;;
          MEDIUM)
            SEVERITY_FLAGS=(--severity ERROR --severity WARNING)
            ;;
          LOW)
            # No severity filter: run all rules.
            ;;
          *)
            echo "::warning::Unknown severity '$SEVERITY'; defaulting to HIGH"
            SEVERITY_FLAGS=(--severity ERROR)
            ;;
        esac
        # Diff-aware scans only see files changed since the baseline; findings
        # that already exist in untouched files are invisible, so this stays
        # opt-in rather than the default gate behaviour.
        if [ "${DIFF_SCAN,,}" == "true" ]; then
          if [ -z "$BASELINE_REF" ]; then
            echo "::error::diff-scan is true but baseline-ref is empty"
            exit 1
          fi
          BASELINE="$(git merge-base "$BASELINE_REF" HEAD 2>/dev/null || echo "")"
          if [ -z "$BASELINE" ]; then
            echo "::error::could not resolve merge-base with '$BASELINE_REF'; ensure fetch-depth: 0"
            exit 1
          fi
          export SEMGREP_BASELINE_COMMIT="$BASELINE"
          echo "Diff-aware scan against baseline $BASELINE"
        fi
        echo "Scanning $SCAN_PATH with Semgrep (severity >= $SEVERITY)..."
        # --error makes Semgrep exit non-zero on findings, blocking the PR.
        read -ra extra_args <<< "$EXTRA_ARGS"
        semgrep \
          --config=p/security-audit \
          --config=p/owasp-top-ten \
          --config=p/secrets \
          --config=p/ci \
          "${SEVERITY_FLAGS[@]}" \
          --sarif \
          --output="$SARIF" \
          --error \
          "${extra_args[@]}" \
          "$SCAN_PATH" || true
        if [ ! -f "$SARIF" ]; then
          echo "::error::Semgrep did not produce a SARIF file"
          exit 1
        fi
        COUNT=$(python3 -c "import json; print(len(json.load(open('$SARIF')).get('results', [])))" 2>/dev/null || echo "0")
        echo "Findings: $COUNT"
        echo "sarif-path=$SARIF" >> "$GITHUB_OUTPUT"
        echo "findings=$COUNT" >> "$GITHUB_OUTPUT"
        if [ "$COUNT" -ne 0 ]; then
          echo "::error::$COUNT Semgrep finding(s) detected. See the SARIF report in the GitHub Security tab."
          exit 1
        fi
        echo "✅ No Semgrep findings at or above $SEVERITY severity."

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-path }}
        category: semgrep-sast
        token: ${{ inputs.github-token }}
