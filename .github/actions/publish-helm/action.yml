name: 'Publish Helm'
description: 'Publishes Helm chart to chart repository'
inputs:
  chart-path:
    description: 'Path to packaged chart'
    required: true
  chart-repo:
    description: 'Chart repository URL'
    required: true
  github-token:
    description: 'GitHub token'
    required: true
  repo-branch:
    description: 'Branch for chart repo'
    required: false
    default: 'gh-pages'
outputs:
  chart-url:
    description: 'URL to published chart'
    value: ${{ steps.push.outputs.chart-url }}
runs:
  using: composite
  steps:
    - name: Install Helm
      uses: azure/setup-helm@v4
    - name: Publish chart
      shell: bash
      run: |
        CHART="${{ inputs.chart-path }}"
        REPO="${{ inputs.chart-repo }}"
        BRANCH="${{ inputs.repo-branch }}"
        
        if [ ! -f "$CHART" ]; then
          echo "❌ Chart not found: $CHART"
          exit 1
        fi
        
        # Clone chart repo
        git clone --branch "$BRANCH" "$REPO" chart-repo || mkdir -p chart-repo
        
        # Copy chart to repo
        cp "$CHART" chart-repo/
        
        # Generate index
        cd chart-repo
        helm repo index . --url "$REPO"
        
        # Commit and push
        git add .
        git -c user.name="GitHub Actions" -c user.email="actions@github.com" commit -m "Add chart $(basename $CHART)"
        git push origin "$BRANCH"
        
        echo "chart-url=$REPO/$(basename $CHART)" >> "$GITHUB_OUTPUT"
        echo "✅ Chart published to $REPO"
