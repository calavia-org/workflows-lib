name: 'Detect Technologies'
description: 'Detects buildable technologies in a repository based on file indicators'
inputs:
  fail-on-missing:
    description: 'Fail if no technologies detected'
    required: false
    default: 'false'
  warn-on-missing-mise:
    description: 'Warn if mise.toml is missing'
    required: false
    default: 'true'
  tox-ini:
    description: 'Path to tox.ini or tox-ansible.ini for Python projects'
    required: false
    default: 'tox.ini'
  python-version:
    description: 'Fallback Python version for the matrix when no tox env list is available'
    required: false
    default: '3.12'
outputs:
  technologies:
    description: 'Comma-separated list of detected technologies'
    value: ${{ steps.detect.outputs.technologies }}
  count:
    description: 'Number of technologies detected'
    value: ${{ steps.detect.outputs.count }}
  python:
    description: 'Path to Python indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.python }}
  go:
    description: 'Path to Go indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.go }}
  rust:
    description: 'Path to Rust indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.rust }}
  java:
    description: 'Path to Java indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.java }}
  ansible-collection:
    description: 'Path to Ansible collection indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.ansible-collection }}
  container:
    description: 'Path to Container indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.container }}
  ansible-execution-environment:
    description: 'Path to Ansible EE indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.ansible-execution-environment }}
  helm:
    description: 'Path to Helm indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.helm }}
  nodejs:
    description: 'Path to Node.js indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.nodejs }}
  generic:
    description: 'Path to generic build indicator file (empty if not detected)'
    value: ${{ steps.detect.outputs.generic }}
  primary:
    description: 'Primary technology, in the vocabulary consumed by run-tests'
    value: ${{ steps.detect.outputs.primary }}
  mise:
    description: 'Path to mise.toml (empty if not detected)'
    value: ${{ steps.detect.outputs.mise }}
  python-matrix:
    description: 'JSON array of Python versions for the unit-test matrix'
    value: ${{ steps.detect.outputs.python-matrix }}
  has-molecule:
    description: 'Whether molecule scenarios were found'
    value: ${{ steps.detect.outputs.has-molecule }}
  molecule-scenarios:
    description: 'JSON array of discovered molecule scenario names'
    value: ${{ steps.detect.outputs.molecule-scenarios }}
  molecule-scenarios-count:
    description: 'Number of discovered molecule scenarios'
    value: ${{ steps.detect.outputs.molecule-scenarios-count }}
runs:
  using: composite
  steps:
    - name: Detect technologies
      id: detect
      shell: bash
      env:
        FAIL_ON_MISSING: ${{ inputs.fail-on-missing }}
        WARN_ON_MISSING_MISE: ${{ inputs.warn-on-missing-mise }}
        TOX_INI: ${{ inputs.tox-ini }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        TECHS=""
        COUNT=0
        PYTHON=""
        GO=""
        RUST=""
        JAVA=""
        ANSIBLE_COLLECTION=""
        CONTAINER=""
        ANSIBLE_EE=""
        HELM=""
        NODEJS=""
        GENERIC=""
        MISE=""

        # Check for mise.toml
        if [ -f "mise.toml" ]; then
          MISE="mise.toml"
        fi

        if [ -z "$MISE" ] && [ "$WARN_ON_MISSING_MISE" == "true" ]; then
          echo "::warning::mise.toml not found — add one to declare the toolchain"
        fi

        # Read the declared toolchain from mise (mise-first). Only repositories
        # that ship a mise.toml are read, so a runner's global mise config can
        # never leak a technology into a repo that declares none.
        MISE_TECHS=""
        if [ -n "$MISE" ] && command -v mise >/dev/null 2>&1; then
          export MISE_TRUSTED_CONFIG_PATHS="$PWD"
          MISE_JSON="$(mise ls --json 2>/dev/null || true)"
          if [ -n "$MISE_JSON" ]; then
            MISE_TECHS=$(MISE_JSON="$MISE_JSON" python3 - <<'PY' 2>/dev/null || true
        import json
        import os

        # mise shortnames -> the vocabulary run-tests branches on.
        MAPPING = {"python": "python", "node": "nodejs", "go": "go", "rust": "rust", "java": "java"}

        declared = json.loads(os.environ["MISE_JSON"])
        technologies = []
        for tool in declared:
            technology = MAPPING.get(tool.lower(), tool.lower())
            if technology not in technologies:
                technologies.append(technology)
        print(",".join(technologies))
        PY
        )
          fi
        fi

        # Add mise-derived technologies (non-primary kinds like bun etc are recorded but won't become primary)
        if [ -n "$MISE_TECHS" ]; then
          # We'll process each to set specific outputs where applicable
          IFS=',' read -ra MT <<< "$MISE_TECHS"
          for t in "${MT[@]}"; do
            case "$t" in
              python)
                if [ -z "$PYTHON" ]; then PYTHON="mise.toml"; fi
                if [[ ! "$TECHS" =~ (^|,)python(,|$) ]]; then
                  TECHS="python,${TECHS}"; COUNT=$((COUNT+1))
                fi
                ;;
              nodejs)
                if [ -z "$NODEJS" ]; then NODEJS="mise.toml"; fi
                if [[ ! "$TECHS" =~ (^|,)nodejs(,|$) ]]; then
                  TECHS="nodejs,${TECHS}"; COUNT=$((COUNT+1))
                fi
                ;;
              go)
                if [ -z "$GO" ]; then GO="mise.toml"; fi
                if [[ ! "$TECHS" =~ (^|,)go(,|$) ]]; then
                  TECHS="go,${TECHS}"; COUNT=$((COUNT+1))
                fi
                ;;
              rust)
                if [ -z "$RUST" ]; then RUST="mise.toml"; fi
                if [[ ! "$TECHS" =~ (^|,)rust(,|$) ]]; then
                  TECHS="rust,${TECHS}"; COUNT=$((COUNT+1))
                fi
                ;;
              java)
                if [ -z "$JAVA" ]; then JAVA="mise.toml"; fi
                if [[ ! "$TECHS" =~ (^|,)java(,|$) ]]; then
                  TECHS="java,${TECHS}"; COUNT=$((COUNT+1))
                fi
                ;;
              *)
                # Record other mise tools verbatim if not already present
                if [[ ! "$TECHS" =~ (^|,)$t(,|$) ]]; then
                  TECHS="$t,${TECHS}"; COUNT=$((COUNT+1))
                fi
                ;;
            esac
          done
        fi

        # Ansible Collection detection (file-based; not mise-managed)
        if [ -f "galaxy.yml" ]; then
          ANSIBLE_COLLECTION="galaxy.yml"
          if [[ ! "$TECHS" =~ (^|,)ansible-collection(,|$) ]]; then
            TECHS="ansible-collection,${TECHS}"
            COUNT=$((COUNT + 1))
          fi
        fi

        # Container detection (Dockerfile or Containerfile; file-based)
        if [ -f "Dockerfile" ]; then
          CONTAINER="Dockerfile"
        elif [ -f "Containerfile" ]; then
          CONTAINER="Containerfile"
        fi

        if [ -n "$CONTAINER" ]; then
          if [[ ! "$TECHS" =~ (^|,)container(,|$) ]]; then
            TECHS="container,${TECHS}"
            COUNT=$((COUNT + 1))
          fi
        fi

        # Ansible Execution Environment detection (file-based)
        if [ -f "execution-environment.yml" ]; then
          ANSIBLE_EE="execution-environment.yml"
        elif [ -f "execution-environment.yaml" ]; then
          ANSIBLE_EE="execution-environment.yaml"
        fi

        if [ -n "$ANSIBLE_EE" ]; then
          if [[ ! "$TECHS" =~ (^|,)ansible-execution-environment(,|$) ]]; then
            TECHS="ansible-execution-environment,${TECHS}"
            COUNT=$((COUNT + 1))
          fi
        fi

        # Helm detection - find Chart.yaml anywhere in the repo (fixed from Chart.yml)
        HELM=$(find . -name "Chart.yaml" -type f 2>/dev/null | head -1 | sed 's|^\./||')

        if [ -n "$HELM" ]; then
          if [[ ! "$TECHS" =~ (^|,)helm(,|$) ]]; then
            TECHS="helm,${TECHS}"
            COUNT=$((COUNT + 1))
          fi
        fi

        # Generic build detection (file-based)
        if [ -f "Makefile" ]; then
          GENERIC="Makefile"
        elif [ -f "VERSION" ]; then
          GENERIC="VERSION"
        elif [ -f "version.txt" ]; then
          GENERIC="version.txt"
        fi

        if [ -n "$GENERIC" ]; then
          if [[ ! "$TECHS" =~ (^|,)generic(,|$) ]]; then
            TECHS="generic,${TECHS}"
            COUNT=$((COUNT + 1))
          fi
        fi

        # Remove trailing comma
        TECHS=$(echo "$TECHS" | sed 's/,$//')

        if [ "$COUNT" -eq 0 ] && [ "$FAIL_ON_MISSING" == "true" ]; then
          echo "No technologies detected"
          exit 1
        fi

        # Primary technology, in the vocabulary run-tests consumes. Precedence
        # mirrors what workflows-lib applied in its own local detector, and the
        # ansible-collection/container values are mapped to the ansible/docker
        # names that consumers already branch on.
        PRIMARY=""
        if [ -n "$ANSIBLE_COLLECTION" ]; then
          PRIMARY="ansible"
        elif [ -n "$PYTHON" ]; then
          PRIMARY="python"
        elif [ -n "$NODEJS" ]; then
          PRIMARY="nodejs"
        elif [ -n "$GO" ]; then
          PRIMARY="go"
        elif [ -n "$RUST" ]; then
          PRIMARY="rust"
        elif [ -n "$JAVA" ]; then
          PRIMARY="java"
        elif [ -n "$CONTAINER" ]; then
          PRIMARY="docker"
        else
          PRIMARY="generic"
        fi

        # Python test matrix: derived from the tox env list so the unit job
        # covers every declared interpreter. The matrix must never be empty —
        # an empty matrix silently skips the job — so every non-derived path
        # falls back to the single configured version.
        PYTHON_MATRIX="[\"$PYTHON_VERSION\"]"
        if [ -n "$PYTHON" ]; then
          TOX_FILE=""
          for candidate in "$TOX_INI" "tox-ansible.ini"; do
            if [ -f "$candidate" ]; then
              TOX_FILE="$candidate"
              break
            fi
          done
          if [ -n "$TOX_FILE" ]; then
            PARSED=$(TOX_FILE="$TOX_FILE" python3 - <<'PY' 2>/dev/null || true
        import json
        import os
        import re

        text = open(os.environ["TOX_FILE"]).read()
        # Isolate the [tox] section; env_list values may wrap onto indented lines.
        section = re.search(r"^\[tox\]\s*$(.*?)(?=^\[|\Z)", text, re.S | re.M)
        versions = []
        if section:
            key = re.search(
                r"^\s*env_?list\s*[:=]\s*(.*(?:\n[ \t]+.*)*)",
                section.group(1),
                re.M,
            )
            if key:
                for token in re.split(r"[,\s]+", key.group(1)):
                    match = re.fullmatch(r"py(\d)(\d+)", token)
                    if match:
                        version = f"{match.group(1)}.{match.group(2)}"
                        if version not in versions:
                            versions.append(version)
        print(json.dumps(versions))
        PY
        )
            if [ -n "$PARSED" ] && [ "$PARSED" != "[]" ]; then
              PYTHON_MATRIX="$PARSED"
            else
              echo "::warning::$TOX_FILE declares no py<version> envs in its tox env list — python matrix falls back to $PYTHON_VERSION"
            fi
          else
            echo "::warning::no tox file found ($TOX_INI or tox-ansible.ini) — python matrix falls back to $PYTHON_VERSION"
          fi
        fi

        # Discover molecule scenarios
        MOLECULE_SCENARIOS_ARRAY=()
        for search_path in "extensions/molecule" "molecule"; do
          [ -d "$search_path" ] || continue
          for scenario_dir in "$search_path"/*; do
            [ -d "$scenario_dir" ] || continue
            scenario_name=$(basename "$scenario_dir")
            [ -f "$scenario_dir/molecule.yml" ] || continue
            MOLECULE_SCENARIOS_ARRAY+=("$scenario_name")
          done
        done

        if [ ${#MOLECULE_SCENARIOS_ARRAY[@]} -gt 0 ]; then
          UNIQUE_MOLECULE=($(printf "%s\n" "${MOLECULE_SCENARIOS_ARRAY[@]}" | awk '!seen[$0]++'))
          MOLECULE_COUNT=${#UNIQUE_MOLECULE[@]}
          MOLECULE_JSON=$(printf "%s\n" "${UNIQUE_MOLECULE[@]}" | jq -R . | jq -s -c .)
          echo "has-molecule=true" >> "$GITHUB_OUTPUT"
          echo "molecule-scenarios=$MOLECULE_JSON" >> "$GITHUB_OUTPUT"
          echo "molecule-scenarios-count=$MOLECULE_COUNT" >> "$GITHUB_OUTPUT"
        else
          echo "has-molecule=false" >> "$GITHUB_OUTPUT"
          echo "molecule-scenarios=[]" >> "$GITHUB_OUTPUT"
          echo "molecule-scenarios-count=0" >> "$GITHUB_OUTPUT"
        fi

        # Set outputs
        echo "technologies=$TECHS" >> "$GITHUB_OUTPUT"
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
        echo "python=$PYTHON" >> "$GITHUB_OUTPUT"
        echo "go=$GO" >> "$GITHUB_OUTPUT"
        echo "rust=$RUST" >> "$GITHUB_OUTPUT"
        echo "java=$JAVA" >> "$GITHUB_OUTPUT"
        echo "nodejs=$NODEJS" >> "$GITHUB_OUTPUT"
        echo "generic=$GENERIC" >> "$GITHUB_OUTPUT"
        echo "ansible-collection=$ANSIBLE_COLLECTION" >> "$GITHUB_OUTPUT"
        echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
        echo "ansible-execution-environment=$ANSIBLE_EE" >> "$GITHUB_OUTPUT"
        echo "helm=$HELM" >> "$GITHUB_OUTPUT"
        echo "mise=$MISE" >> "$GITHUB_OUTPUT"
        echo "python-matrix=$PYTHON_MATRIX" >> "$GITHUB_OUTPUT"

        # Summary
        echo "Detected $COUNT technology(ies): $TECHS"
        echo "Primary technology: $PRIMARY"
