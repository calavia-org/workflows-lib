name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pre-commit pyyaml

      # Runs actionlint (which includes shellcheck) plus the gate-truth-table and
      # bump-version-derivation suites at the revisions pinned in
      # .pre-commit-config.yaml, so this job cannot drift from local `pre-commit run`.
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  validate-actions:
    name: Validate composite actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install --quiet pyyaml

      - name: Validate action metadata
        run: python3 tests/validate-actions.py

  guard:
    name: Guard self-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `$/` binds to the repo owning the file that contains the `uses:` line, at
      # the running commit, and is documented for reusable workflow calls. This
      # inverts the previous guard, which forced cross-repo `workflows-lib@v0`
      # self-references — a ratchet, since a fix merged here could not be used by
      # the release that publishes it. ("Runs as if part of the caller" still
      # applies to context-driven actions like actions/checkout; unrelated.)
      # Requires runner >= 2.336.0; unavailable on GitHub Enterprise Server.
      - name: Enforce self-reference form
        run: |
          failed=0
          for path in .github/workflows/*.yml .github/actions/*/action.yml; do
            # A local self-reference must never carry a ref. actionlint <= 1.7.12
            # silently accepts a pinned local ref, so lint cannot catch this.
            if grep -nE 'uses:[[:space:]]+(\$/|\./)\.github/[^[:space:]]*@' "$path"; then
              echo "::error file=$path::local self-reference must not carry an @ref suffix"
              failed=1
            fi
            # A reference back into this repository by owner/name is the ratchet.
            if grep -nE 'calavia-org/workflows-lib/\.github/' "$path"; then
              echo "::error file=$path::cross-repo self-reference found; use \$/ to bind to the running commit"
              failed=1
            fi
          done
          exit $failed

  test:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install --quiet pyyaml

      - name: Release gate truth table
        run: python3 tests/gate-truth-table.py

      - name: Version bump derivation
        run: python3 tests/bump-version-derivation.py

      - name: Technology detection
        run: python3 tests/detect-technology.py

      - name: Release floating tag derivation
        run: python3 tests/release-github-floating-tag.py

      - name: Version authority
        run: python3 tests/version-authority.py
