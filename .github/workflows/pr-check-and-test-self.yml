name: Self PR Check and Test

# Internal caller that exercises the reusable pr-check-and-test.yml contract on
# workflows-lib's own pull requests. Using `$/` references the contract at the
# PR head, so changes to the contract are validated by the very PR that
# introduces them.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-check-and-test:
    name: PR Check and Test
    permissions:
      contents: write
      checks: write
      pull-requests: write
      security-events: write
      actions: read
    uses: $/.github/workflows/pr-check-and-test.yml
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
