name: CI

'on':
  workflow_call:
    inputs:
      technology:
        description: 'Technology stack (auto-detect if not specified)'
        type: string
        required: false
        default: 'auto'
      run-pre-commit:
        description: 'Run pre-commit hooks'
        type: boolean
        required: false
        default: true
      run-build:
        description: 'Run build step'
        type: boolean
        required: false
        default: true
      run-tests:
        description: 'Deprecated: no-op. Unit tests run in the Unit Test job (run-unit-tests) and integration tests in the Integration Test job (run-integration-tests). Kept only so existing callers on the floating v0 ref do not fail with an unexpected input.'
        type: boolean
        required: false
        default: true
      run-unit-tests:
        description: 'Run unit tests'
        type: boolean
        required: false
        default: true
      run-integration-tests:
        description: 'Run integration tests'
        type: boolean
        required: false
        default: true
      run-e2e-tests:
        description: 'Run end-to-end tests'
        type: boolean
        required: false
        default: false
      run-package:
        description: 'Run packaging step'
        type: boolean
        required: false
        default: false
      prerelease-enabled:
        description: 'Create a GitHub pre-release from the build/package artifacts. Only fires when the PR targets a release/* branch, so ordinary PRs against main never create a release.'
        type: boolean
        required: false
        default: false
      pre-release-artifacts:
        description: "Comma-separated artifacts to attach to the pre-release, or 'auto' to resolve them per technology. For Ansible this resolves to the collection tarball only, deliberately excluding the execution environment."
        type: string
        required: false
        default: 'auto'
      fail-on-missing:
        description: 'Fail if config file missing'
        type: boolean
        required: false
        default: false
      custom-pre-commit-config:
        description: 'Path to custom pre-commit config'
        type: string
        required: false
        default: ''
      pre-commit-fail-on-missing:
        description: 'Fail the pre-commit job if no pre-commit config is found. Kept separate from fail-on-missing, which governs technology detection, not config presence.'
        type: boolean
        required: false
        default: true
      test-command:
        description: 'Override test command'
        type: string
        required: false
        default: ''
      integration-test-command:
        description: 'Override integration test command'
        type: string
        required: false
        default: ''
      run-molecule-parallel:
        description: 'When true and molecule scenarios are detected for ansible-collection repos, run each scenario in parallel'
        type: boolean
        required: false
        default: true
      molecule-search-paths:
        description: 'Comma-separated paths to search for molecule scenarios'
        type: string
        required: false
        default: 'extensions/molecule,molecule'
      molecule-scenarios-matrix:
        description: 'JSON array to override molecule scenarios matrix (for testing/customization)'
        type: string
        required: false
        default: ''
      build-command:
        description: 'Override build command'
        type: string
        required: false
        default: ''
      package-command:
        description: 'Override package command'
        type: string
        required: false
        default: ''
      runner-label:
        description: 'Runner label'
        type: string
        required: false
        default: 'ubuntu-24.04'
      timeout-minutes:
        description: 'Global timeout'
        type: number
        required: false
        default: 30
      artifact-retention-days:
        description: 'Artifact retention days'
        type: number
        required: false
        default: 7
      cache-enabled:
        description: 'Enable caching'
        type: boolean
        required: false
        default: true
      report-enabled:
        description: 'Publish test reports'
        type: boolean
        required: false
        default: true
      python-version:
        description: 'Python version'
        type: string
        required: false
        default: '3.12'
      node-version:
        description: 'Node.js version'
        type: string
        required: false
        default: '20'
      go-version:
        description: 'Go version'
        type: string
        required: false
        default: '1.22'
      rust-toolchain:
        description: 'Rust toolchain'
        type: string
        required: false
        default: 'stable'
      java-version:
        description: 'Java version'
        type: string
        required: false
        default: '21'
      java-distribution:
        description: 'Java distribution'
        type: string
        required: false
        default: 'temurin'
      codecov-token:
        description: 'Codecov token'
        type: string
        required: false
        default: ''
      slack-webhook:
        description: 'Slack webhook URL'
        type: string
        required: false
        default: ''
      notify-on-failure:
        description: 'Notify only on failure'
        type: boolean
        required: false
        default: true
      test-timeout:
        description: 'Test timeout in minutes'
        type: number
        required: false
        default: 30
      max-parallel:
        description: 'Max parallel test jobs'
        type: number
        required: false
        default: 4
      fail-fast:
        description: 'Fail fast on first test failure'
        type: boolean
        required: false
        default: false
      tox-ini:
        description: 'Path to tox.ini'
        type: string
        required: false
        default: 'tox.ini'
      integration-python-matrix:
        description: 'JSON array of Python versions for the integration matrix; defaults to the tox-derived python-matrix'
        type: string
        required: false
        default: ''
      ansible-collection-path:
        description: 'Path to Ansible collection'
        type: string
        required: false
        default: ''
      test-paths:
        description: 'Comma-separated test paths'
        type: string
        required: false
        default: ''
      extra-args:
        description: 'Extra arguments'
        type: string
        required: false
        default: ''
      coverage-format:
        description: 'Coverage format'
        type: string
        required: false
        default: 'xml'
      coverage-tool:
        description: 'Coverage tool'
        type: string
        required: false
        default: 'codecov'
      comment-on-pr:
        description: 'Comment on PR'
        type: boolean
        required: false
        default: true
      summary-title:
        description: 'Summary title'
        type: string
        required: false
        default: 'CI Results'
      run-security-scans:
        description: 'Run the security scanning job'
        type: boolean
        required: false
        default: true
      scan-secrets:
        description: 'Run secret scanning with TruffleHog'
        type: boolean
        required: false
        default: true
      scan-sast:
        description: 'Run static analysis with Semgrep'
        type: boolean
        required: false
        default: true
      scan-misconfig:
        description: 'Run misconfiguration scanning with Trivy'
        type: boolean
        required: false
        default: true
      scan-dependencies:
        description: 'Run dependency vulnerability scanning with OSV-Scanner'
        type: boolean
        required: false
        default: true
      security-severity:
        description: 'Minimum severity that causes the security job to fail (HIGH, MEDIUM, LOW)'
        type: string
        required: false
        default: 'HIGH'
      security-sarif-upload:
        description: 'Upload SARIF reports to the GitHub Security tab'
        type: boolean
        required: false
        default: true
      security-sast-diff-scan:
        description: 'Scan only files changed in the PR (diff-aware SAST). Off by default: a diff scan cannot report pre-existing findings in untouched files, so keep a full scan elsewhere for the Security tab.'
        type: boolean
        required: false
        default: false
      security-dependency-review:
        description: 'Run the pull-request-only Dependency Review gate using the GitHub dependency graph'
        type: boolean
        required: false
        default: true
      security-dependencies-extra-args:
        description: 'Extra arguments appended to the OSV-Scanner CLI (for example --no-resolve or --experimental-exclude=...)'
        type: string
        required: false
        default: ''

    secrets:
      github-token:
        description: 'GitHub token'
        required: false
      codecov-token:
        description: 'Codecov token'
        required: false
      slack-webhook:
        description: 'Slack webhook'
        required: false

# Baseline for every job that checks out the repo or runs code from the PR
# (tox, pre-commit hooks, build/package scripts). A caller may grant a broader
# token, so without this those jobs would inherit the caller's grant and leave a
# writable token sitting in the workspace while PR code runs. `report` and
# `pre-release` widen this for the one permission each actually needs.
permissions:
  contents: read

jobs:
  detect:
    name: Detect Technology
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 5
    outputs:
      technologies: ${{ steps.detect.outputs.technologies }}
      primary: ${{ steps.detect.outputs.primary }}
      # Derived from the tox env list; single-version fallback for non-Python
      # repos or a missing tox file, so the unit matrix is never empty.
      python-matrix: ${{ steps.detect.outputs.python-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup mise
        if: ${{ hashFiles('mise.toml') != '' }}
        uses: jdx/mise-action@v5
        with:
          install: false
          cache: false
      - uses: $/.github/actions/detect-technology
        id: detect
        with:
          fail-on-missing: ${{ inputs.fail-on-missing }}
          tox-ini: ${{ inputs.tox-ini }}
          python-version: ${{ inputs.python-version }}

  pre-commit:
    name: Pre-Commit
    needs: detect
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ inputs.run-pre-commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/run-pre-commit
        with:
          custom-config: ${{ inputs.custom-pre-commit-config }}
          fail-on-missing: ${{ inputs.pre-commit-fail-on-missing }}
          all-files: 'true'

  # Security scans are a standalone quality gate. They run in parallel with the
  # build/test phases and feed into the final report gate. The job needs
  # security-events: write so the scanner actions can upload SARIF results.
  #
  # One matrix leg per scanner. Each leg uploads SARIF under its own job name,
  # so uploads no longer share a single job's code-scanning analysis key —
  # sequential uploads in one job contend on that key and the second upload
  # can fail the whole job. Legs also run concurrently instead of serially.
  # fail-fast is hardcoded false (not the test-lanes input): a red scanner
  # must not cancel its siblings, because every scanner's report is needed
  # to triage the PR.
  security:
    name: Security Scan
    needs: detect
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ always() && inputs.run-security-scans && (needs.detect.result == 'success' || needs.detect.result == 'skipped') }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        scanner: [secrets, sast, misconfig, dependencies]
    steps:
      # Skipped legs (scanner disabled by input) need no checkout.
      - uses: actions/checkout@v7
        if: ${{ (matrix.scanner == 'secrets' && inputs.scan-secrets) || (matrix.scanner == 'sast' && inputs.scan-sast) || (matrix.scanner == 'misconfig' && inputs.scan-misconfig) || (matrix.scanner == 'dependencies' && inputs.scan-dependencies) }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan secrets
        if: ${{ matrix.scanner == 'secrets' && inputs.scan-secrets }}
        uses: $/.github/actions/scan-secrets
        with:
          path: .
          severity: ${{ inputs.security-severity }}
          upload-sarif: ${{ inputs.security-sarif-upload }}
          github-token: ${{ secrets.github-token || secrets.GITHUB_TOKEN }}
      - name: Scan SAST
        if: ${{ matrix.scanner == 'sast' && inputs.scan-sast }}
        uses: $/.github/actions/scan-sast
        with:
          path: .
          severity: ${{ inputs.security-severity }}
          upload-sarif: ${{ inputs.security-sarif-upload }}
          diff-scan: ${{ inputs.security-sast-diff-scan }}
          baseline-ref: ${{ github.event.pull_request.base.sha }}
          github-token: ${{ secrets.github-token || secrets.GITHUB_TOKEN }}
      - name: Scan misconfigurations
        if: ${{ matrix.scanner == 'misconfig' && inputs.scan-misconfig }}
        uses: $/.github/actions/scan-misconfig
        with:
          path: .
          severity: ${{ inputs.security-severity }}
          upload-sarif: ${{ inputs.security-sarif-upload }}
          github-token: ${{ secrets.github-token || secrets.GITHUB_TOKEN }}
      - name: Scan dependencies
        if: ${{ matrix.scanner == 'dependencies' && inputs.scan-dependencies }}
        uses: $/.github/actions/scan-dependencies
        with:
          path: .
          severity: ${{ inputs.security-severity }}
          upload-sarif: ${{ inputs.security-sarif-upload }}
          extra-args: ${{ inputs.security-dependencies-extra-args }}
          github-token: ${{ secrets.github-token || secrets.GITHUB_TOKEN }}

  # Dependency Review is a pull-request gate, not a scanner: it reads the GitHub
  # dependency graph and reports only the vulnerabilities a PR introduces, which
  # is fast enough to run on every PR. It complements the full OSV-Scanner leg,
  # which resolves every manifest in the repository and is the slow path.
  dependency-review:
    name: Dependency Review
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' && inputs.security-dependency-review }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: ${{ inputs.security-severity == 'HIGH' && 'high' || inputs.security-severity == 'MEDIUM' && 'moderate' || 'low' }}
          comment-summary-in-pr: ${{ inputs.comment-on-pr }}

  # Unit tests are the mandatory gate for the code under test. Always runs, so a
  # skipped unit job still reports instead of vanishing.
  unit:
    name: Unit Test
    # `build` is a prerequisite: for a technology whose unit tests run against
    # the build output, there is nothing to test until `build` produces it.
    # When `build` is disabled the result is `skipped`, which is accepted.
    # `pre-commit` is deliberately NOT a prerequisite: lint is a quality check
    # like the tests are, not an input the tests consume, so it is asserted by
    # the `report` gate instead of blocking the tests from running.
    needs: [detect, build]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      max-parallel: ${{ fromJSON(inputs.max-parallel) }}
      # One leg per Python version declared in the tox env list; consumers
      # require only the aggregated Gate check, so per-version job names are
      # safe. The detect fallback keeps the matrix non-empty.
      matrix:
        python-version: ${{ fromJSON(needs.detect.outputs.python-matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run unit tests
        uses: $/.github/actions/run-tests
        with:
          technology: ${{ inputs.technology != 'auto' && inputs.technology || needs.detect.outputs.primary }}
          run-unit-tests: ${{ inputs.run-unit-tests }}
          run-integration-tests: false
          run-e2e-tests: false
          test-command: ${{ inputs.test-command }}
          python-version: ${{ matrix.python-version }}
          node-version: ${{ inputs.node-version }}
          go-version: ${{ inputs.go-version }}
          rust-toolchain: ${{ inputs.rust-toolchain }}
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          cache-enabled: ${{ inputs.cache-enabled }}
          test-timeout: ${{ inputs.test-timeout }}
          tox-ini: ${{ inputs.tox-ini }}
          ansible-collection-path: ${{ inputs.ansible-collection-path }}
          test-paths: ${{ inputs.test-paths }}
          extra-args: ${{ inputs.extra-args }}
          coverage-format: ${{ inputs.coverage-format }}
          fail-fast: ${{ inputs.fail-fast }}

  build:
    name: Build
    needs: detect
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ inputs.run-build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup environment
        uses: $/.github/actions/run-tests
        with:
          technology: ${{ inputs.technology != 'auto' && inputs.technology || needs.detect.outputs.primary }}
          run-unit-tests: false
          run-integration-tests: false
          run-e2e-tests: false
          cache-enabled: ${{ inputs.cache-enabled }}
      - name: Run build
        shell: bash
        run: |
          TECH="${{ inputs.technology != 'auto' && inputs.technology || needs.detect.outputs.primary }}"

          # Use custom command if provided
          if [ -n "${{ inputs.build-command }}" ]; then
            echo "Running custom build command..."
            ${{ inputs.build-command }}
            exit 0
          fi

          # Technology-specific build
          case "$TECH" in
            python)
              if [ -f "pyproject.toml" ] && command -v poetry &> /dev/null; then
                poetry build
              elif [ -f "setup.py" ]; then
                python setup.py build
              elif [ -f "setup.cfg" ]; then
                python -m build
              fi
              ;;
            ansible)
              # Collections have no compile step; the galaxy tarball is built in `package`.
              COLLECTION_PATH="${{ inputs.ansible-collection-path }}"
              if [ -z "$COLLECTION_PATH" ]; then
                COLLECTION_PATH="$(dirname "$(find . -name galaxy.yml -not -path '*/node_modules/*' -print -quit)")"
              fi
              if [ -f "$COLLECTION_PATH/galaxy.yml" ]; then
                echo "✅ Collection manifest found at $COLLECTION_PATH/galaxy.yml"
              else
                echo "❌ No galaxy.yml found (searched '$COLLECTION_PATH')"
                exit 1
              fi
              ;;
            nodejs)
              if [ -f "package.json" ]; then
                if grep -q '"build"' package.json; then
                  npm run build
                fi
              fi
              ;;
            go)
              go build ./...
              ;;
            rust)
              cargo build --release
              ;;
            java)
              if [ -f "pom.xml" ]; then
                mvn compile
              elif [ -f "build.gradle" ]; then
                gradle build -x test
              fi
              ;;
            docker)
              if [ -f "Dockerfile" ]; then
                docker build -t ${{ github.repository }}:${{ github.sha }} .
              fi
              ;;
            generic)
              if [ -f "Makefile" ] && grep -q "^build:" Makefile; then
                make build
              fi
              ;;
          esac
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            dist/
            bin/
            build/
            target/
            *.tar
            *.tar.gz
            *.jar
            *.whl
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore

  package:
    name: Package
    # `build` is a prerequisite: some technologies package the build output
    # (the `docker` case `docker save`s an image produced by `docker build`).
    # A `failed` build is not accepted: there is nothing to package. When
    # `build` is disabled the result is `skipped`, which is accepted.
    needs: [detect, build]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ always() && inputs.run-package && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run package
        shell: bash
        run: |
          TECH="${{ inputs.technology != 'auto' && inputs.technology || needs.detect.outputs.primary }}"

          # Use custom command if provided
          if [ -n "${{ inputs.package-command }}" ]; then
            echo "Running custom package command..."
            ${{ inputs.package-command }}
            exit 0
          fi

            # Technology-specific package
            case "$TECH" in
              python)
                if [ -f "pyproject.toml" ] && command -v poetry &> /dev/null; then
                  poetry build
                elif [ -f "setup.py" ]; then
                  python setup.py sdist bdist_wheel
                elif [ -f "setup.cfg" ]; then
                  python -m build
                fi
                ;;
              ansible)
                # Must stay a separate branch: collections have no pyproject.toml/setup.py, so merging it into `python)` silently produces no artifact.
                COLLECTION_PATH="${{ inputs.ansible-collection-path }}"
                if [ -z "$COLLECTION_PATH" ]; then
                  COLLECTION_PATH="$(dirname "$(find . -name galaxy.yml -not -path '*/node_modules/*' -print -quit)")"
                fi
                if [ ! -f "$COLLECTION_PATH/galaxy.yml" ]; then
                  echo "❌ No galaxy.yml found (searched '$COLLECTION_PATH')"
                  exit 1
                fi
                mkdir -p dist
                ansible-galaxy collection build --output-path dist --force "$COLLECTION_PATH"
                echo "✅ Built collection artifact:"
                ls -la dist/
                ;;
            nodejs)
              if [ -f "package.json" ]; then
                npm pack
              fi
              ;;
            go)
              go build -o bin/ .
              ;;
            rust)
              cargo package
              ;;
            java)
              if [ -f "pom.xml" ]; then
                mvn package -DskipTests
              elif [ -f "build.gradle" ]; then
                gradle jar
              fi
              ;;
            docker)
              if [ -f "Dockerfile" ]; then
                docker save ${{ github.repository }}:${{ github.sha }} > ${{ github.repository }}-${{ github.sha }}.tar
              fi
              ;;
              generic)
                if [ -f "Makefile" ] && grep -q "^package:" Makefile; then
                  make package
                fi
                ;;
            esac
      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-output
          path: |
            dist/
            *.tar
            *.tar.gz
            *.tgz
            *.whl
            *.jar
            *.zip
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore

  # Integration tests do not consume `build-output` or `package-output`; they
  # set up their own environment from the checked-out source. They therefore
  # start as soon as `detect` finishes, alongside `build`, `package` and
  # `unit`, instead of queueing behind them. They are the slow, environment
  # heavy tier (molecule/Docker), and because they usually dominate the
  # critical path, overlapping them with the other tiers is what keeps the
  # whole run close to the duration of integration alone.
  discover-molecule:
    name: Discover Molecule Scenarios
    needs: [detect]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 5
    if: ${{ always() && inputs.run-integration-tests && inputs.run-molecule-parallel && (needs.detect.outputs.primary == 'ansible' || needs.detect.outputs.technologies == 'ansible-collection' || contains(needs.detect.outputs.technologies, 'ansible')) }}
    outputs:
      scenarios: ${{ steps.discover.outputs.scenarios }}
      count: ${{ steps.discover.outputs.count }}
      has-molecule: ${{ steps.discover.outputs.has-molecule }}
      scenarios-matrix: ${{ steps.discover.outputs.scenarios-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: discover
        uses: $/.github/actions/discover-molecule-scenarios
        with:
          search-paths: ${{ inputs.molecule-search-paths }}

  integration-plan:
    name: Integration Test Plan
    needs: [detect, discover-molecule]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 5
    if: ${{ always() && inputs.run-integration-tests && (needs.discover-molecule.result == 'success' || needs.discover-molecule.result == 'skipped') }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        env:
          OVERRIDE: ${{ inputs.molecule-scenarios-matrix }}
          RUN_PARALLEL: ${{ inputs.run-molecule-parallel }}
          HAS_MOLECULE: ${{ needs.discover-molecule.outputs.has-molecule }}
          SCENARIOS_MATRIX: ${{ needs.discover-molecule.outputs.scenarios-matrix }}
          INTEGRATION_PYTHON_MATRIX: ${{ inputs.integration-python-matrix }}
          PYTHON_MATRIX: ${{ needs.detect.outputs.python-matrix }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            echo "matrix=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using override matrix: $OVERRIDE"
          elif [ "$RUN_PARALLEL" == 'true' ] && [ "$HAS_MOLECULE" == 'true' ] && [ "$SCENARIOS_MATRIX" != '{"scenario":[]}' ]; then
            echo "matrix=$SCENARIOS_MATRIX" >> "$GITHUB_OUTPUT"
            echo "Using molecule scenario matrix: $SCENARIOS_MATRIX"
          else
            PY_MATRIX="$PYTHON_MATRIX"
            if [ -n "$INTEGRATION_PYTHON_MATRIX" ]; then
              PY_MATRIX="$INTEGRATION_PYTHON_MATRIX"
            fi
            MATRIX="{"python-version":$PY_MATRIX}"
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "Using python matrix: $MATRIX"
          fi

  integration:
    name: Integration Test
    needs: [detect, package, discover-molecule, integration-plan]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ always() && inputs.run-integration-tests && (needs.package.result == 'success' || needs.package.result == 'skipped') && (needs.integration-plan.result == 'success' || needs.integration-plan.result == 'skipped') }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      max-parallel: ${{ fromJSON(inputs.max-parallel) }}
      matrix: ${{ fromJSON(needs.integration-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run integration tests
        uses: $/.github/actions/run-tests
        with:
          technology: ${{ inputs.technology != 'auto' && inputs.technology || needs.detect.outputs.primary }}
          run-unit-tests: false
          run-integration-tests: true
          run-e2e-tests: ${{ inputs.run-e2e-tests }}
          integration-test-command: ${{ inputs.integration-test-command }}
          python-version: ${{ matrix.python-version || inputs.python-version }}
          node-version: ${{ inputs.node-version }}
          go-version: ${{ inputs.go-version }}
          rust-toolchain: ${{ inputs.rust-toolchain }}
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          cache-enabled: ${{ inputs.cache-enabled }}
          test-timeout: ${{ inputs.test-timeout }}
          tox-ini: ${{ inputs.tox-ini }}
          ansible-collection-path: ${{ inputs.ansible-collection-path }}
          test-paths: ${{ inputs.test-paths }}
          extra-args: ${{ inputs.extra-args }}
          coverage-format: ${{ inputs.coverage-format }}
          fail-fast: ${{ inputs.fail-fast }}
          molecule-scenario: ${{ matrix.scenario || '' }}

  # Pre-releases are only ever cut from a release/* base branch, so ordinary
  # PRs against main never create a release. The artifact list is resolved per
  # technology, which is what keeps the Ansible execution environment out of a
  # pre-release while the real release still builds it.
  #
  # `build` and `package` no longer gate each other, so this job waits on the
  # `report` job: that is the single place where unit, integration and package
  # results are already combined into one verdict, and depending on it keeps
  # "tests pass" and "release exists" impossible to disagree.
  pre-release:
    name: Pre-Release
    # `report` is the single quality gate. It needs `build` and `package`, so
    # both complete before this job starts and their artifacts are guaranteed
    # to exist for the unfiltered `download-artifact` below.
    needs: [report]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ inputs.prerelease-enabled && always() && startsWith(github.base_ref, 'release/') && needs.report.result == 'success' }}
    # Creating the GitHub Release is the only thing in this workflow that needs
    # write access, which is why it is scoped to this job alone.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect pre-release artifacts
        id: artifacts
        uses: $/.github/actions/detect-artifacts
        with:
          pre-release-artifacts: ${{ inputs.pre-release-artifacts }}
      - name: Download build and package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-output'
          path: pre-release-artifacts
          merge-multiple: true
      - name: Select artifacts for this technology
        id: select
        shell: bash
        run: |
          SELECTED="${{ steps.artifacts.outputs.pre-release-artifacts }}"
          echo "Resolved pre-release artifacts: $SELECTED"
          if [ -z "$SELECTED" ]; then
            echo "❌ detect-artifacts produced no pre-release-artifacts output."
            echo "prerelease-enabled is true, so a pre-release is expected and its absence"
            echo "is a failure, not something to skip. Check that workflows-lib is released"
            echo "so that @v0 includes the pre-release-artifacts output."
            exit 1
          fi
          if [ "$SELECTED" = "auto" ]; then
            echo "❌ detect-artifacts left pre-release-artifacts unresolved (auto)."
            exit 1
          fi
          if [ "$SELECTED" != "binary" ]; then
            echo "❌ '$SELECTED' is not produced by this workflow."
            echo "This workflow only runs the build and package steps, so 'binary' is the"
            echo "only selectable category. docker/execution-environment/helm artifacts are"
            echo "built by the release workflow, not the PR check."
            exit 1
          fi
          FOUND=$(find pre-release-artifacts -type f | sort)
          if [ -z "$FOUND" ]; then
            echo "❌ Resolved 'binary' but no artifacts were downloaded"
            exit 1
          fi
          echo "Artifacts to attach:"
          awk '{print "  " $0}' <<< "$FOUND"
          {
            echo "paths<<EOF"
            echo "$FOUND"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create pre-release
        uses: $/.github/actions/publish-github-release
        with:
          version: 0.0.0-pr.${{ github.run_number }}
          release-name: "Pre-release ${{ github.ref_name }} (build ${{ github.run_number }})"
          release-notes: "Automated pre-release from build ${{ github.run_number }}. Artifact types: ${{ steps.artifacts.outputs.pre-release-artifacts }}"
          prerelease: 'true'
          draft: 'false'
          artifacts: ${{ steps.select.outputs.paths }}
          github-token: ${{ secrets.github-token }}

  # Named `Gate` and pinned to `always()` on purpose: this is the check consumers
  # pin as a required status check on main, so gating it on report-enabled would
  # leave it unreported and block every PR org-wide.
  report:
    name: Gate
    # Every job listed here is asserted by the gate step below, which is required
    # because GitHub reports an upstream failure to its dependents as `skipped`,
    # not `failure`: a failed `package` skips `integration`, and a skipped
    # `integration` is otherwise indistinguishable from an intentional one.
    # `pre-commit` is listed even though no other job depends on it, so that its
    # result is asserted directly rather than being enforced by accident through
    # `unit` skipping.
    needs: [unit, integration, build, package, pre-commit, security, dependency-review]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    if: ${{ always() }}
    # Publishing test results creates checks and the PR comment, neither of
    # which the `contents: read` baseline allows.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish reports
        uses: $/.github/actions/publish-reports
        with:
          technology: ${{ inputs.technology }}
          report-enabled: ${{ inputs.report-enabled }}
          coverage-format: ${{ inputs.coverage-format }}
          coverage-tool: ${{ inputs.coverage-tool }}
          codecov-token: ${{ inputs.codecov-token }}
          artifact-retention-days: ${{ inputs.artifact-retention-days }}
          publish-test-results: ${{ inputs.report-enabled }}
          publish-coverage: ${{ inputs.report-enabled }}
          publish-sarif: false
          comment-on-pr: ${{ inputs.comment-on-pr }}
          github-token: ${{ secrets.github-token }}
          slack-webhook: ${{ inputs.slack-webhook }}
          notify-on-failure: ${{ inputs.notify-on-failure }}
          summary-title: ${{ inputs.summary-title }}
      - name: Verify required tests passed
        if: ${{ always() }}
        shell: bash
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          echo "Unit: $UNIT_RESULT"
          echo "Integration: $INTEGRATION_RESULT"
          echo "Build: $BUILD_RESULT"
          echo "Package: $PACKAGE_RESULT"
          echo "Pre-Commit: $PRE_COMMIT_RESULT"
          echo "Dependency Review: $DEPENDENCY_REVIEW_RESULT"
          FAILED=0
          if [ "$UNIT_RESULT" != "success" ]; then
            echo "❌ Unit tests did not pass (result: $UNIT_RESULT)."
            FAILED=1
          fi
          # Integration is optional, so a skipped run is acceptable; a run that
          # started and did not pass is not.
          if [ "$INTEGRATION_RESULT" != "success" ] && [ "$INTEGRATION_RESULT" != "skipped" ]; then
            echo "❌ Integration tests did not pass (result: $INTEGRATION_RESULT)."
            FAILED=1
          fi
          # A failed package skips integration, so the skipped result above
          # cannot be told apart from an intentional skip. Without this the
          # required `Gate` check would go green while `Package` is red.
          if [ "$PACKAGE_RESULT" != "success" ] && [ "$PACKAGE_RESULT" != "skipped" ]; then
            echo "❌ Packaging did not pass (result: $PACKAGE_RESULT)."
            FAILED=1
          fi
          # Currently redundant: a failed `build` skips `unit`, which the gate
          # already rejects. Asserted anyway so the gate covers every job it
          # depends on directly, and keeps that coverage if `unit` is ever
          # decoupled from `build`.
          if [ "$BUILD_RESULT" != "success" ] && [ "$BUILD_RESULT" != "skipped" ]; then
            echo "❌ Build did not pass (result: $BUILD_RESULT)."
            FAILED=1
          fi
          # Not redundant, unlike `build` above: no job depends on `pre-commit`,
          # so no skip can carry its failure here. Without this check a failing
          # hook would leave the required `Gate` check green.
          if [ "$PRE_COMMIT_RESULT" != "success" ] && [ "$PRE_COMMIT_RESULT" != "skipped" ]; then
            echo "❌ Pre-commit did not pass (result: $PRE_COMMIT_RESULT)."
            FAILED=1
          fi
          # `security` is another quality gate with no downstream dependents; a
          # failed scan must be asserted directly, otherwise a skip would let the
          # required `Gate` check go green while SAST/secret findings exist.
          if [ "$SECURITY_RESULT" != "success" ] && [ "$SECURITY_RESULT" != "skipped" ]; then
            echo "❌ Security scans did not pass (result: $SECURITY_RESULT)."
            FAILED=1
          fi
          # Dependency Review only runs on pull requests, and the input can turn
          # it off, so `skipped` is legitimate. A run that started and did not
          # pass is not.
          if [ "$DEPENDENCY_REVIEW_RESULT" != "success" ] && [ "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]; then
            echo "❌ Dependency review did not pass (result: $DEPENDENCY_REVIEW_RESULT)."
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "This check gates the merge, so it must not report success while its"
            echo "tests are failing or were cancelled."
            exit 1
          fi
          echo "✅ Required tests passed."
