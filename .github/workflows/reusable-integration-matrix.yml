name: Reusable Integration Matrix
on:
  workflow_call:
    inputs:
      runner-label:
        description: 'Runner label'
        type: string
        required: false
        default: 'ubuntu-24.04'
      run-integration-tests:
        description: 'Run integration tests'
        type: boolean
        required: false
        default: true
      run-molecule-parallel:
        description: 'When true and molecule scenarios are detected for ansible-collection repos, run each scenario in parallel'
        type: boolean
        required: false
        default: true
      molecule-search-paths:
        description: 'Comma-separated paths to search for molecule scenarios'
        type: string
        required: false
        default: 'extensions/molecule,molecule'
      molecule-scenarios-matrix:
        description: 'JSON array to override molecule scenarios matrix'
        type: string
        required: false
        default: ''
      molecule-scenario-filter-mode:
        description: 'all = full scenario matrix; affected = only scenarios touched by PR changes'
        type: string
        required: false
        default: 'all'
      molecule-scenario-mapping:
        description: 'Optional path to a JSON/YAML mapping of scenario -> role/pattern list'
        type: string
        required: false
        default: ''
      molecule-affected-fallback-all:
        description: 'Return all scenarios when affected-mode cannot determine any affected scenario'
        type: boolean
        required: false
        default: true
      integration-python-matrix:
        description: 'JSON array of Python versions for the integration matrix'
        type: string
        required: false
        default: ''
      integration-ansible-matrix:
        description: 'JSON array of ansible-core versions for the integration matrix (ansible consumers only)'
        type: string
        required: false
        default: ''
      python-matrix:
        description: 'JSON array of Python versions derived from tox (fallback when no explicit matrix is given)'
        type: string
        required: false
        default: ''
      primary:
        description: 'Primary technology detected by detect-technology'
        type: string
        required: false
        default: ''
      technologies:
        description: 'Comma-separated list of detected technologies'
        type: string
        required: false
        default: ''
      base-sha:
        description: 'Base SHA for affected-mode diff'
        type: string
        required: false
        default: ''
      head-sha:
        description: 'Head SHA for affected-mode diff'
        type: string
        required: false
        default: ''
      before-sha:
        description: 'Push event before SHA fallback'
        type: string
        required: false
        default: ''
    outputs:
      scenarios:
        description: 'JSON array of scenario names'
        value: ${{ jobs.discover-molecule.outputs.scenarios }}
      count:
        description: 'Number of scenarios found'
        value: ${{ jobs.discover-molecule.outputs.count }}
      has-molecule:
        description: 'Whether molecule scenarios were found'
        value: ${{ jobs.discover-molecule.outputs.has-molecule }}
      scenarios-matrix:
        description: 'Ready-to-use matrix JSON for scenarios'
        value: ${{ jobs.discover-molecule.outputs.scenarios-matrix }}
      matrix:
        description: 'Final integration test matrix JSON'
        value: ${{ jobs.integration-plan.outputs.matrix }}

jobs:
  discover-molecule:
    name: Discover Molecule Scenarios
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 5
    if: ${{ always() && inputs.run-integration-tests && inputs.run-molecule-parallel && (inputs.primary == 'ansible' || inputs.technologies == 'ansible-collection' || contains(inputs.technologies, 'ansible')) }}
    outputs:
      scenarios: ${{ steps.discover.outputs.scenarios }}
      count: ${{ steps.discover.outputs.count }}
      has-molecule: ${{ steps.discover.outputs.has-molecule }}
      scenarios-matrix: ${{ steps.discover.outputs.scenarios-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: discover
        uses: $/.github/actions/discover-molecule-scenarios
        with:
          search-paths: ${{ inputs.molecule-search-paths }}
          filter-mode: ${{ inputs.molecule-scenario-filter-mode }}
          scenario-mapping: ${{ inputs.molecule-scenario-mapping }}
          fallback-all: ${{ inputs.molecule-affected-fallback-all }}
          base-sha: ${{ inputs.base-sha }}
          head-sha: ${{ inputs.head-sha }}
          before-sha: ${{ inputs.before-sha }}

  integration-plan:
    name: Integration Test Plan
    needs: [discover-molecule]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 5
    if: ${{ always() && inputs.run-integration-tests && (needs.discover-molecule.result == 'success' || needs.discover-molecule.result == 'skipped') }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        env:
          OVERRIDE: ${{ inputs.molecule-scenarios-matrix }}
          RUN_PARALLEL: ${{ inputs.run-molecule-parallel }}
          HAS_MOLECULE: ${{ needs.discover-molecule.outputs.has-molecule }}
          SCENARIOS_MATRIX: ${{ needs.discover-molecule.outputs.scenarios-matrix }}
          INTEGRATION_PYTHON_MATRIX: ${{ inputs.integration-python-matrix }}
          INTEGRATION_ANSIBLE_MATRIX: ${{ inputs.integration-ansible-matrix }}
          PYTHON_MATRIX: ${{ inputs.python-matrix }}
        run: |
          set -euo pipefail

          build_dimensions() {
            local dims='{}'
            if [ -n "$INTEGRATION_PYTHON_MATRIX" ]; then
              dims="{\"python-version\": $INTEGRATION_PYTHON_MATRIX}"
            fi
            if [ -n "$INTEGRATION_ANSIBLE_MATRIX" ]; then
              dims=$(printf '%s\n%s' "$dims" "$INTEGRATION_ANSIBLE_MATRIX" | jq -s '.[0] * {("ansible-core"): .[1]}')
            fi
            printf '%s\n' "$dims"
          }

          combine_with_scenarios() {
            local dims="$1"
            local scenarios="$2"
            echo "$dims" "$scenarios" | jq -s '
              .[0] as $dims |
              .[1].scenario as $scenarios |
              ($dims | keys) as $keys |
              {
                include: [
                  $scenarios[] as $scenario |
                  ([$dims[$keys[]]] | combinations) as $values |
                  {scenario: $scenario} + (
                    [range($keys | length)] | map({($keys[.]): $values[.]}) | add
                  )
                ]
              }
            '
          }

          combine_dimensions() {
            local dims="$1"
            echo "$dims" | jq '
              keys as $keys |
              {
                include: [
                  ([.[$keys[]]] | combinations) as $values |
                  [range($keys | length)] | map({($keys[.]): $values[.]}) | add
                ]
              }
            '
          }

          emit_matrix() {
            local value="$1"
            {
              echo "matrix<<GITHUB_OUTPUT_EOF"
              echo "$value"
              echo "GITHUB_OUTPUT_EOF"
            } >> "$GITHUB_OUTPUT"
          }

          if [ -n "$OVERRIDE" ]; then
            emit_matrix "$OVERRIDE"
            echo "Using override matrix: $OVERRIDE"
          else
            DIMENSIONS=$(build_dimensions)

            if [ "$RUN_PARALLEL" == 'true' ] && [ "$HAS_MOLECULE" == 'true' ] && [ "$SCENARIOS_MATRIX" != '{"scenario":[]}' ]; then
              if [ "$DIMENSIONS" == '{}' ]; then
                emit_matrix "$SCENARIOS_MATRIX"
                echo "Using molecule scenario matrix: $SCENARIOS_MATRIX"
              else
                MATRIX=$(combine_with_scenarios "$DIMENSIONS" "$SCENARIOS_MATRIX")
                emit_matrix "$MATRIX"
                echo "Using molecule scenario + dimension matrix: $MATRIX"
              fi
            else
              if [ "$DIMENSIONS" == '{}' ]; then
                MATRIX=$(echo "$PYTHON_MATRIX" | jq -c '{"python-version": .}')
                emit_matrix "$MATRIX"
                echo "Using python matrix: $MATRIX"
              else
                MATRIX=$(combine_dimensions "$DIMENSIONS")
                emit_matrix "$MATRIX"
                echo "Using dimension matrix: $MATRIX"
              fi
            fi
          fi
