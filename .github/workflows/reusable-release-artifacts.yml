name: Release Artifacts

on:
  workflow_call:
    inputs:
      technology:
        description: 'Technology stack (auto-detect if not specified)'
        type: string
        required: false
        default: 'auto'
      artifacts:
        description: 'Artifacts to build (auto-detect if not specified)'
        type: string
        required: false
        default: 'auto'
      version-source:
        description: 'Path to version file (auto-detect if not specified)'
        type: string
        required: false
        default: 'auto'
      release-name:
        description: 'Override release name'
        type: string
        required: false
        default: ''
      release-draft:
        description: 'Create as draft'
        type: boolean
        required: false
        default: false
      generate-notes:
        description: 'Auto-generate release notes'
        type: boolean
        required: false
        default: true
      update-floating-major-tag:
        description: 'Update floating major tag (e.g., v1) to point to this release'
        type: boolean
        required: false
        default: false
      publish-github-release:
        description: 'Create GitHub Release'
        type: boolean
        required: false
        default: true
      publish-ghcr:
        description: 'Publish Docker image to GHCR'
        type: boolean
        required: false
        default: false
      publish-package-manager:
        description: 'Publish to package manager'
        type: boolean
        required: false
        default: false
      publish-helm-chart:
        description: 'Publish Helm chart'
        type: boolean
        required: false
        default: false
      ghcr-image-name:
        description: 'GHCR image name'
        type: string
        required: false
        default: ''
      ghcr-tags:
        description: 'Additional GHCR tags'
        type: string
        required: false
        default: 'latest'
      helm-chart-path:
        description: 'Path to Helm chart'
        type: string
        required: false
        default: 'helm'
      helm-chart-repo:
        description: 'Helm chart repo URL'
        type: string
        required: false
        default: ''
      package-manager:
        description: 'Package manager'
        type: string
        required: false
        default: 'auto'
      binary-artifacts:
        description: 'Paths to binary artifacts'
        type: string
        required: false
        default: ''
      release-notes-template:
        description: 'Custom release notes template'
        type: string
        required: false
        default: ''
      changelog-since:
        description: 'Generate changelog since tag'
        type: string
        required: false
        default: ''
      sign-artifacts:
        description: 'Enable signing'
        type: boolean
        required: false
        default: false
      sign-binary:
        description: 'Sign binary'
        type: boolean
        required: false
        default: false
      sign-docker:
        description: 'Sign Docker'
        type: boolean
        required: false
        default: false
      sign-helm:
        description: 'Sign Helm'
        type: boolean
        required: false
        default: false
      rollback-on-failure:
        description: 'Rollback on failure'
        type: boolean
        required: false
        default: true
      runner-label:
        description: 'Runner label'
        type: string
        required: false
        default: 'ubuntu-24.04'
      timeout-minutes:
        description: 'Timeout'
        type: number
        required: false
        default: 60
      artifact-retention-days:
        description: 'Artifact retention'
        type: number
        required: false
        default: 7
      notify-on-release:
        description: 'Send notification'
        type: boolean
        required: false
        default: true
      slack-webhook:
        description: 'Slack webhook'
        type: string
        required: false
        default: ''
      python-version:
        description: 'Python version'
        type: string
        required: false
        default: '3.12'
      node-version:
        description: 'Node.js version'
        type: string
        required: false
        default: '20'
      go-version:
        description: 'Go version'
        type: string
        required: false
        default: '1.22'
      rust-toolchain:
        description: 'Rust toolchain'
        type: string
        required: false
        default: 'stable'
      java-version:
        description: 'Java version'
        type: string
        required: false
        default: '21'
      java-distribution:
        description: 'Java distribution'
        type: string
        required: false
        default: 'temurin'
      ansible-collection-path:
        description: 'Ansible collection path'
        type: string
        required: false
        default: ''
      ee-definition-file:
        description: 'Path to execution-environment.yml for Ansible EE build'
        type: string
        required: false
        default: 'execution-environment.yml'
      run-tests:
        description: 'Run tests before building artifacts'
        type: boolean
        required: false
        default: false
      test-command:
        description: 'Unit test command to run'
        type: string
        required: false
        default: ''
      integration-test-command:
        description: 'Integration test command template; may reference MATRIX_PYTHON_VERSION, MATRIX_ANSIBLE_CORE, and MATRIX_SCENARIO env vars'
        type: string
        required: false
        default: ''
      integration-python-matrix:
        description: 'JSON array of Python versions for the integration matrix'
        type: string
        required: false
        default: ''
      integration-ansible-matrix:
        description: 'JSON array of ansible-core versions for the integration matrix (ansible consumers only)'
        type: string
        required: false
        default: ''
      molecule-search-paths:
        description: 'Comma-separated paths to search for molecule scenarios'
        type: string
        required: false
        default: 'extensions/molecule,molecule'
      molecule-scenarios-matrix:
        description: 'JSON array to override molecule scenarios matrix'
        type: string
        required: false
        default: ''
      molecule-scenario-filter-mode:
        description: 'all = full scenario matrix; affected = only scenarios touched by PR changes'
        type: string
        required: false
        default: 'all'
      molecule-scenario-mapping:
        description: 'Optional path to a JSON/YAML mapping of scenario -> role/pattern list'
        type: string
        required: false
        default: ''
      molecule-affected-fallback-all:
        description: 'Return all scenarios when affected-mode cannot determine any affected scenario'
        type: boolean
        required: false
        default: true
      tox-ini:
        description: 'Path to tox.ini file'
        type: string
        required: false
        default: 'tox.ini'

    secrets:
      github-token:
        description: 'GitHub token'
        required: false
      gpg-key:
        description: 'GPG key'
        required: false
      gpg-passphrase:
        description: 'GPG passphrase'
        required: false
      cosign-key:
        description: 'Cosign key'
        required: false
      cosign-password:
        description: 'Cosign password'
        required: false
      package-token:
        description: 'Package manager token'
        required: false
      package-username:
        description: 'Package manager username'
        required: false
      package-password:
        description: 'Package manager password'
        required: false
      slack-webhook:
        description: 'Slack webhook'
        required: false

jobs:
  detect:
    name: Detect Version & Artifacts
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-file: ${{ steps.version.outputs.version-file }}
      technology: ${{ steps.version.outputs.technology }}
      artifacts: ${{ steps.artifacts.outputs.artifacts }}
      binary-type: ${{ steps.artifacts.outputs.binary-type }}
      python-matrix: ${{ steps.technology.outputs.python-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: $/.github/actions/detect-version
        id: version
        with:
          version-source: ${{ inputs.version-source }}
      - uses: $/.github/actions/detect-artifacts
        id: artifacts
        with:
          artifacts: ${{ inputs.artifacts }}
      - uses: $/.github/actions/detect-technology
        id: technology
        with:
          tox-ini: ${{ inputs.tox-ini }}
          python-version: ${{ inputs.python-version }}

  integration-matrix:
    name: Integration Matrix
    needs: detect
    if: ${{ always() && inputs.run-tests && inputs.integration-test-command != '' }}
    uses: $/.github/workflows/reusable-integration-matrix.yml
    with:
      runner-label: ${{ inputs.runner-label }}
      run-integration-tests: true
      run-molecule-parallel: true
      molecule-search-paths: ${{ inputs.molecule-search-paths }}
      molecule-scenarios-matrix: ${{ inputs.molecule-scenarios-matrix }}
      molecule-scenario-filter-mode: ${{ inputs.molecule-scenario-filter-mode }}
      molecule-scenario-mapping: ${{ inputs.molecule-scenario-mapping }}
      molecule-affected-fallback-all: ${{ inputs.molecule-affected-fallback-all }}
      integration-python-matrix: ${{ inputs.integration-python-matrix }}
      integration-ansible-matrix: ${{ inputs.integration-ansible-matrix }}
      python-matrix: ${{ needs.detect.outputs.python-matrix }}
      primary: ${{ needs.detect.outputs.technology || inputs.technology }}
      technologies: ${{ needs.detect.outputs.technology || inputs.technology }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      before-sha: ${{ github.event.before }}

  unit:
    name: Unit Test
    needs: detect
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ inputs.run-tests && inputs.test-command != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/run-tests
        with:
          technology: ${{ needs.detect.outputs.technology || inputs.technology }}
          test-command: ${{ inputs.test-command }}
          tox-ini: ${{ inputs.tox-ini }}
          python-version: ${{ inputs.python-version }}
          coverage-report: false
          test-report-format: junit
          cache-enabled: true
          run-unit-tests: true
          run-integration-tests: false

  integration:
    name: Integration Test
    needs: [detect, integration-matrix]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ always() && inputs.run-tests && inputs.integration-test-command != '' && (needs.integration-matrix.result == 'success' || needs.integration-matrix.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.integration-matrix.outputs.matrix) }}
    env:
      MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
      MATRIX_ANSIBLE_CORE: ${{ matrix.ansible-core }}
      MATRIX_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/run-tests
        with:
          technology: ${{ needs.detect.outputs.technology || inputs.technology }}
          integration-test-command: ${{ inputs.integration-test-command }}
          tox-ini: ${{ inputs.tox-ini }}
          python-version: ${{ matrix.python-version || inputs.python-version }}
          coverage-report: false
          test-report-format: junit
          cache-enabled: true
          run-unit-tests: false
          run-integration-tests: true
          molecule-scenario: ${{ matrix.scenario || '' }}

  build-binary:
    name: Build Binary
    needs: [detect, unit, integration]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ contains(needs.detect.outputs.artifacts, 'binary') && (needs.unit.result == 'success' || needs.unit.result == 'skipped') && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    outputs:
      artifact-path: ${{ steps.build.outputs.artifact-path }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/build-binary
        id: build
        with:
          technology: ${{ inputs.technology != 'auto' && inputs.technology || needs.detect.outputs.binary-type }}
          version: ${{ needs.detect.outputs.version }}
          python-version: ${{ inputs.python-version }}
          node-version: ${{ inputs.node-version }}
          go-version: ${{ inputs.go-version }}
          rust-toolchain: ${{ inputs.rust-toolchain }}
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          ansible-collection-path: ${{ inputs.ansible-collection-path }}

  build-docker:
    name: Build Docker
    needs: [detect, build-binary, unit, integration]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ contains(needs.detect.outputs.artifacts, 'docker') && (needs.unit.result == 'success' || needs.unit.result == 'skipped') && (needs.integration.result == 'success' || needs.integration.result == 'skipped') && (needs.build-binary.result == 'success' || needs.build-binary.result == 'skipped') }}
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}
      image-name: ${{ steps.build.outputs.image-name }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/build-docker
        id: build
        with:
          version: ${{ needs.detect.outputs.version }}
          image-name: ${{ inputs.ghcr-image-name }}
          additional-tags: ${{ inputs.ghcr-tags }}

  build-ee:
    name: Build Execution Environment
    needs: [detect, build-binary, unit, integration]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ contains(needs.detect.outputs.artifacts, 'execution-environment') && (needs.unit.result == 'success' || needs.unit.result == 'skipped') && (needs.integration.result == 'success' || needs.integration.result == 'skipped') && (needs.build-binary.result == 'success' || needs.build-binary.result == 'skipped') }}
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}
      image-name: ${{ steps.build.outputs.image-name }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/build-ee
        id: build
        with:
          version: ${{ needs.detect.outputs.version }}
          image-name: ${{ inputs.ghcr-image-name }}
          additional-tags: ${{ inputs.ghcr-tags }}
          ee-definition-file: ${{ inputs.ee-definition-file }}

  build-helm:
    name: Build Helm
    needs: [detect, build-docker, build-ee, unit, integration]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ contains(needs.detect.outputs.artifacts, 'helm') && always() && needs.detect.result == 'success' && (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped') && (needs.build-ee.result == 'success' || needs.build-ee.result == 'skipped') && (needs.unit.result == 'success' || needs.unit.result == 'skipped') && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    outputs:
      chart-path: ${{ steps.build.outputs.chart-path }}
      chart-name: ${{ steps.build.outputs.chart-name }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/build-helm
        id: build
        with:
          version: ${{ needs.detect.outputs.version }}
          app-version: ${{ needs.detect.outputs.version }}
          chart-path: ${{ inputs.helm-chart-path }}
          image-name: ${{ needs.build-docker.outputs.image-name || needs.build-ee.outputs.image-name }}
          image-tag: ${{ needs.build-docker.outputs.image-tag || needs.build-ee.outputs.image-tag }}

  sign-binary:
    name: Sign Binary
    needs: [detect, build-binary, unit, integration]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    if: ${{ inputs.sign-artifacts && inputs.sign-binary && contains(needs.detect.outputs.artifacts, 'binary') && (needs.build-binary.result == 'success' || needs.build-binary.result == 'skipped') && (needs.unit.result == 'success' || needs.unit.result == 'skipped') && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/sign-binary
        with:
          artifact-path: ${{ needs.build-binary.outputs.artifact-path }}
          gpg-key: ${{ secrets.gpg-key }}
          gpg-passphrase: ${{ secrets.gpg-passphrase }}

  sign-docker:
    name: Sign Container
    needs: [detect, build-docker, build-ee, unit, integration]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    if: ${{ inputs.sign-artifacts && inputs.sign-docker && always() && needs.detect.result == 'success' && (contains(needs.detect.outputs.artifacts, 'docker') || contains(needs.detect.outputs.artifacts, 'execution-environment')) && (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped') && (needs.build-ee.result == 'success' || needs.build-ee.result == 'skipped') && (needs.unit.result == 'success' || needs.unit.result == 'skipped') && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/sign-docker
        with:
          image-tag: ${{ needs.build-docker.outputs.image-tag || needs.build-ee.outputs.image-tag }}
          cosign-key: ${{ secrets.cosign-key }}

  sign-helm:
    name: Sign Helm
    needs: [detect, build-helm, unit, integration]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    if: ${{ inputs.sign-artifacts && inputs.sign-helm && contains(needs.detect.outputs.artifacts, 'helm') && (needs.build-helm.result == 'success' || needs.build-helm.result == 'skipped') && (needs.unit.result == 'success' || needs.unit.result == 'skipped') && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/sign-helm
        with:
          chart-path: ${{ needs.build-helm.outputs.chart-path }}
          gpg-key: ${{ secrets.gpg-key }}
          gpg-passphrase: ${{ secrets.gpg-passphrase }}

  publish-github-release:
    name: Publish GitHub Release
    needs: [detect, build-binary, build-docker, build-ee, build-helm, sign-binary, sign-docker, sign-helm, unit, integration]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    if: ${{ inputs.publish-github-release && always() && needs.detect.result == 'success' && (needs.build-binary.result == 'success' || needs.build-binary.result == 'skipped') && (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped') && (needs.build-ee.result == 'success' || needs.build-ee.result == 'skipped') && (needs.build-helm.result == 'success' || needs.build-helm.result == 'skipped') && (needs.unit.result == 'success' || needs.unit.result == 'skipped') && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    outputs:
      release-url: ${{ steps.publish.outputs.release-url }}
      release-id: ${{ steps.publish.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/generate-release-notes
        id: notes
        with:
          version: ${{ needs.detect.outputs.version }}
          since: ${{ inputs.changelog-since }}
      - uses: $/.github/actions/publish-github-release
        id: publish
        with:
          version: ${{ needs.detect.outputs.version }}
          release-name: ${{ inputs.release-name }}
          release-notes: ${{ steps.notes.outputs.notes }}
          draft: ${{ inputs.release-draft }}
          generate-notes: ${{ inputs.generate-notes }}
          github-token: ${{ secrets.github-token || secrets.GITHUB_TOKEN }}

  update-floating-major-tag:
    name: Update floating major tag
    needs: [detect, publish-github-release]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 5
    if: ${{ inputs.update-floating-major-tag && always() && needs.detect.result == 'success' && needs.publish-github-release.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.github-token || secrets.GITHUB_TOKEN }}

      - name: Move floating major tag
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          MAJOR="v$(echo "$VERSION" | cut -d. -f1)"
          TAG="v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -f "$MAJOR" "$TAG"
          git push origin "$MAJOR" --force

          echo "Updated floating tag: $MAJOR -> $TAG"

  publish-ghcr:
    name: Publish to GHCR
    needs: [detect, build-docker, build-ee, sign-docker, unit, integration]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    if: ${{ inputs.publish-ghcr && always() && needs.detect.result == 'success' && (needs.build-docker.result == 'success' || needs.build-ee.result == 'success') && (needs.unit.result == 'success' || needs.unit.result == 'skipped') && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    steps:
      - uses: $/.github/actions/publish-ghcr
        with:
          image-tag: ${{ needs.build-docker.outputs.image-tag || needs.build-ee.outputs.image-tag }}
          additional-tags: ${{ inputs.ghcr-tags }}
          github-token: ${{ secrets.github-token || secrets.GITHUB_TOKEN }}

  publish-package:
    name: Publish Package
    needs: [detect, build-binary, sign-binary, unit, integration]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    if: ${{ inputs.publish-package-manager && always() && needs.detect.result == 'success' && (needs.build-binary.result == 'success' || needs.build-binary.result == 'skipped') && (needs.unit.result == 'success' || needs.unit.result == 'skipped') && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/publish-package
        with:
          package-manager: ${{ inputs.package-manager }}
          artifact-path: ${{ needs.build-binary.outputs.artifact-path }}
          token: ${{ secrets.package-token }}
          username: ${{ secrets.package-username }}
          password: ${{ secrets.package-password }}

  publish-helm:
    name: Publish Helm
    needs: [detect, build-helm, sign-helm, unit, integration]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    if: ${{ inputs.publish-helm-chart && always() && needs.detect.result == 'success' && (needs.build-helm.result == 'success' || needs.build-helm.result == 'skipped') && (needs.unit.result == 'success' || needs.unit.result == 'skipped') && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/publish-helm
        with:
          chart-path: ${{ needs.build-helm.outputs.chart-path }}
          chart-repo: ${{ inputs.helm-chart-repo }}
          github-token: ${{ secrets.github-token || secrets.GITHUB_TOKEN }}

  rollback:
    name: Rollback
    needs: [detect, build-docker, build-ee, publish-github-release, publish-ghcr, publish-package, publish-helm]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    if: ${{ inputs.rollback-on-failure && failure() && needs.detect.result == 'success' }}
    steps:
      - uses: $/.github/actions/rollback-release
        with:
          release-id: ${{ needs.publish-github-release.outputs.release-id }}
          image-tags: ${{ needs.build-docker.outputs.image-tag || needs.build-ee.outputs.image-tag }}
          github-token: ${{ secrets.github-token || secrets.GITHUB_TOKEN }}

  notify:
    name: Notify
    needs: [detect, publish-github-release, publish-ghcr, publish-package, publish-helm]
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 5
    if: ${{ inputs.notify-on-release && always() && needs.detect.result == 'success' && (needs.publish-github-release.result == 'success' || needs.publish-github-release.result == 'skipped') && (needs.publish-ghcr.result == 'success' || needs.publish-ghcr.result == 'skipped') && (needs.publish-package.result == 'success' || needs.publish-package.result == 'skipped') && (needs.publish-helm.result == 'success' || needs.publish-helm.result == 'skipped') }}
    steps:
      - name: Slack notification
        if: inputs.slack-webhook != ''
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          VERSION="${{ needs.detect.outputs.version }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" == "success" ]; then
            COLOR="#36a64f"
            TEXT="✅ Released ${REPO} v${VERSION}"
          else
            COLOR="#ff0000"
            TEXT="❌ Release failed for ${REPO} v${VERSION}"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"attachments\":[{\"color\":\"${COLOR}\",\"text\":\"${TEXT}\",\"fields\":[{\"title\":\"Repository\",\"value\":\"${REPO}\",\"short\":true},{\"title\":\"Version\",\"value\":\"v${VERSION}\",\"short\":true},{\"title\":\"Run URL\",\"value\":\"${RUN_URL}\",\"short\":false}]}]}" \
            ${{ inputs.slack-webhook }} || true
