name: PR Check and Auto-Bump

'on':
  workflow_call:
    inputs:
      allowed-branch-pattern:
        description: Regex pattern for allowed branch names (optional, set empty to disable)
        type: string
        default: ^(major|feat|fix|doc)/.+
      allowed-target-branches:
        description: Comma-separated list of allowed target branch patterns
        type: string
        default: main,release/*
      version-file:
        description: Path to version file (auto-detected if not set)
        type: string
        default: auto
      fail-on-invalid-branch:
        description: Fail workflow if branch name is invalid
        type: boolean
        default: false
      require-conventional-commits:
        description: Fail if no conventional commits found in PR
        type: boolean
        default: true
      no-bump-branch-pattern:
        description: Regex pattern for branches that should skip version bump (optional)
        type: string
        default: ''
      base-version-source:
        description: |
          Where to read the base version for the bump: 'tag' (highest release tag
          on the base branch) or 'file' (the version file, i.e. the published
          source of truth). 'file' requires an explicit version-file.
        type: string
        default: tag
    secrets:
      github-token:
        description: GitHub token with write permissions
        required: true

jobs:
  check-pr:
    name: Check PR
    runs-on: ubuntu-24.04
    outputs:
      bump_type: ${{ steps.parse.outputs.bump-type }}
      has_conventional: ${{ steps.parse.outputs.has-conventional }}
      branch_valid: ${{ steps.validate.outputs.branch-valid }}
      target_valid: ${{ steps.validate.outputs.target-valid }}
      should_bump: ${{ steps.validate.outputs.should-bump }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Validate branch
        id: validate
        uses: ./.github/actions/validate-branch
        with:
          branch: ${{ github.head_ref }}
          allowed-branch-pattern: ${{ inputs.allowed-branch-pattern }}
          target-branch: ${{ github.base_ref }}
          allowed-target-branches: ${{ inputs.allowed-target-branches }}
          no-bump-branch-pattern: ${{ inputs.no-bump-branch-pattern }}

      - name: Fail if branch name invalid
        if: ${{ steps.validate.outputs.branch-valid == 'false' && inputs.fail-on-invalid-branch }}
        env:
          BRANCH: ${{ github.head_ref }}
          PATTERN: ${{ inputs.allowed-branch-pattern }}
        run: |
          echo "Branch name $BRANCH does not match required pattern: $PATTERN"
          exit 1

      - name: Fail if target branch invalid
        if: ${{ steps.validate.outputs.target-valid == 'false' }}
        env:
          TARGET: ${{ github.base_ref }}
          ALLOWED: ${{ inputs.allowed-target-branches }}
        run: |
          echo "Target branch $TARGET is not in allowed list: $ALLOWED"
          exit 1

      - name: Parse conventional commits
        id: parse
        uses: ./.github/actions/parse-conventional-commits
        with:
          base-branch: ${{ github.base_ref }}
          pr-title: ${{ github.event.pull_request.title }}
          require-conventional-commits: ${{ inputs.require-conventional-commits }}

  auto-bump-version:
    name: Auto-Bump Version
    needs: check-pr
    if: |
      needs.check-pr.outputs.target_valid == 'true' &&
      needs.check-pr.outputs.has_conventional == 'true' &&
      needs.check-pr.outputs.bump_type != '' &&
      needs.check-pr.outputs.bump_type != 'doc' &&
      needs.check-pr.outputs.should_bump == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.github-token }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch base branch and tags
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Base branch: $BASE_BRANCH"
          git fetch origin "$BASE_BRANCH" --tags

      - name: Resolve base version
        id: base
        uses: ./.github/actions/resolve-base-version
        with:
          version-file-source: ${{ inputs.base-version-source == 'file' && inputs.version-file || inputs.base-version-source }}
          base-branch: ${{ github.base_ref }}

      - name: Bump version using custom action
        id: bump
        uses: ./.github/actions/bump-version
        with:
          bump-type: ${{ needs.check-pr.outputs.bump_type }}
          current-version: ${{ steps.base.outputs.version }}
          version-file: ${{ inputs.version-file }}

      - name: Check if changes exist
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version file changed"
          fi

      - name: Check if already bumped
        id: last_commit
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: ./.github/actions/check-already-bumped
        with:
          version-file: ${{ steps.bump.outputs.version-file }}
          base-branch: ${{ github.base_ref }}

      - name: Commit and push version bump
        if: |
          steps.changes.outputs.changed == 'true' &&
          steps.last_commit.outputs.already-bumped != 'true'
        env:
          BRANCH: ${{ github.head_ref }}
          TYPE: ${{ needs.check-pr.outputs.bump_type }}
          BASE_VERSION: ${{ steps.base.outputs.version }}
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          FILE="${{ steps.bump.outputs.version-file }}"

          # Fail safe: a bump must only ever move the version FORWARD, and only
          # from a clean release base. A prerelease base (e.g. 0.0.0-pr.54) means
          # the base version resolution could not find a real release, so refuse
          # rather than risk an unintended jump or rollback.
          if ! printf '%s' "$BASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to bump: base version '$BASE_VERSION' is not a clean release version"
            echo "::error::The release-tag lookup returned a prerelease; abort rather than roll a released artifact back."
            exit 1
          fi

          if ! [ "$NEW_VERSION" = "$(printf '%s\n%s\n' "$BASE_VERSION" "$NEW_VERSION" | sort -V | tail -1)" ] \
            || [ "$NEW_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::Refusing version bump $BASE_VERSION → $NEW_VERSION (not a forward move)"
            echo "::error::Check the release tags on the base branch; the bump was derived from a bad base version."
            exit 1
          fi

          git add "$FILE"
          git commit -m "chore: bump version to $NEW_VERSION ($TYPE)"
          git push origin "$BRANCH"
