name: PR Check and Auto-Bump

on:
  workflow_call:
    inputs:
      allowed-branch-pattern:
        description: "Regex pattern for allowed branch names (optional, set empty to disable)"
        type: string
        default: "^(major|feat|fix|doc)/.+"
      allowed-target-branches:
        description: "Comma-separated list of allowed target branch patterns"
        type: string
        default: "main,release/*"
      version-file:
        description: "Path to version file (auto-detected if not set)"
        type: string
        default: "auto"
      fail-on-invalid-branch:
        description: "Fail workflow if branch name is invalid"
        type: boolean
        default: false
      require-conventional-commits:
        description: "Fail if no conventional commits found in PR"
        type: boolean
        default: true
      no-bump-branch-pattern:
        description: "Regex pattern for branches that should skip version bump (optional)"
        type: string
        default: ""
      base-version-source:
        description: "Where to read the base version for the bump: 'tag' (highest release tag on the base branch) or 'file' (the version file, i.e. the published source of truth). 'file' requires an explicit version-file."
        type: string
        default: "tag"
    secrets:
      github-token:
        description: "GitHub token with write permissions"
        required: true

jobs:
  check-pr:
    name: Check PR
    runs-on: ubuntu-24.04
    outputs:
      bump_type: ${{ steps.conventional.outputs.bump_type }}
      has_conventional: ${{ steps.conventional.outputs.has_conventional }}
      branch_valid: ${{ steps.validate-branch.outputs.valid }}
      target_valid: ${{ steps.validate-target.outputs.valid }}
      should_bump: ${{ steps.check-no-bump.outputs.should_bump }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check no-bump branch pattern
        id: check-no-bump
        env:
          BRANCH: ${{ github.head_ref }}
          PATTERN: ${{ inputs.no-bump-branch-pattern }}
        run: |
          if [ -z "$PATTERN" ]; then
            echo "should_bump=true" >> "$GITHUB_OUTPUT"
            echo "No no-bump pattern set, allowing bump"
            exit 0
          fi

          if echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Branch '$BRANCH' matches no-bump pattern, skipping version bump"
          else
            echo "should_bump=true" >> "$GITHUB_OUTPUT"
            echo "✅ Branch '$BRANCH' does not match no-bump pattern, allowing bump"
          fi

      - name: Validate branch name
        id: validate-branch
        if: ${{ inputs.allowed-branch-pattern != '' }}
        env:
          BRANCH: ${{ github.head_ref }}
          PATTERN: ${{ inputs.allowed-branch-pattern }}
        run: |
          if [ -z "$PATTERN" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Branch name validation disabled"
            exit 0
          fi

          if echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "✅ Branch name '$BRANCH' matches allowed pattern"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "❌ Branch name '$BRANCH' does NOT match pattern: $PATTERN"
          fi

      - name: Validate target branch
        id: validate-target
        env:
          TARGET: ${{ github.base_ref }}
          ALLOWED: ${{ inputs.allowed-target-branches }}
        run: |
          # Convert comma-separated list to regex pattern
          PATTERN=$(echo "$ALLOWED" | sed 's/,/|/g' | sed 's/\*/.*/g')

          if echo "$TARGET" | grep -qE "^($PATTERN)$"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "✅ Target branch '$TARGET' is allowed"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "❌ Target branch '$TARGET' is NOT in allowed list: $ALLOWED"
          fi

      - name: Parse conventional commits
        id: conventional
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Get all commits in this PR
          COMMITS=$(git log "origin/$BASE_BRANCH..HEAD" --pretty=format:"%s")
          
          echo "Commits in this PR:"
          echo "$COMMITS"
          echo ""
          
          BUMP_TYPE=""
          HAS_CONVENTIONAL="false"
          
          while IFS= read -r commit; do
            # Skip empty lines
            [ -z "$commit" ] && continue
            
            # Check for breaking changes (highest priority)
            if echo "$commit" | grep -qE "^[a-z]+(\(.+\))?!:|BREAKING CHANGE:|BREAKING-CHANGE:"; then
              BUMP_TYPE="major"
              HAS_CONVENTIONAL="true"
              echo "Found breaking change in: $commit"
              break  # Major is highest, no need to check further
            fi
            
            # Check for features
            if echo "$commit" | grep -qE "^feat(\(.+\))?:"; then
              if [ "$BUMP_TYPE" != "major" ]; then
                BUMP_TYPE="minor"
              fi
              HAS_CONVENTIONAL="true"
              echo "Found feature in: $commit"
            fi
            
            # Check for fixes
            if echo "$commit" | grep -qE "^fix(\(.+\))?:"; then
              if [ -z "$BUMP_TYPE" ]; then
                BUMP_TYPE="patch"
              fi
              HAS_CONVENTIONAL="true"
              echo "Found fix in: $commit"
            fi
            
            # Check for other conventional types (chore, docs, refactor, etc.)
            if echo "$commit" | grep -qE "^(chore|docs|style|refactor|perf|test|ci|build)(\(.+\))?:"; then
              if [ -z "$BUMP_TYPE" ]; then
                BUMP_TYPE="patch"
              fi
              HAS_CONVENTIONAL="true"
              echo "Found conventional commit in: $commit"
            fi
          done <<< "$COMMITS"
          
          # If no conventional commits found, check PR title (for squash merges)
          if [ "$HAS_CONVENTIONAL" = "false" ]; then
            echo "No conventional commits found, checking PR title: $PR_TITLE"
            
            if echo "$PR_TITLE" | grep -qE "^[a-z]+(\(.+\))?!:|BREAKING CHANGE:"; then
              BUMP_TYPE="major"
              HAS_CONVENTIONAL="true"
            elif echo "$PR_TITLE" | grep -qE "^feat(\(.+\))?:"; then
              BUMP_TYPE="minor"
              HAS_CONVENTIONAL="true"
            elif echo "$PR_TITLE" | grep -qE "^(fix|chore|docs|style|refactor|perf|test|ci|build)(\(.+\))?:"; then
              BUMP_TYPE="patch"
              HAS_CONVENTIONAL="true"
            fi
          fi
          
          # Default to patch if nothing found and we don't require conventional
          if [ -z "$BUMP_TYPE" ] && [ "${{ inputs.require-conventional-commits }}" = "false" ]; then
            BUMP_TYPE="patch"
            echo "No conventional commits found, defaulting to patch"
          fi
          
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          echo "has_conventional=$HAS_CONVENTIONAL" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Result: bump_type=$BUMP_TYPE, has_conventional=$HAS_CONVENTIONAL"

      - name: Fail if branch name invalid
        if: ${{ steps.validate-branch.outputs.valid == 'false' && inputs.fail-on-invalid-branch }}
        env:
          BRANCH: ${{ github.head_ref }}
          PATTERN: ${{ inputs.allowed-branch-pattern }}
        run: |
          echo "Branch name $BRANCH does not match required pattern: $PATTERN"
          exit 1

      - name: Fail if target branch invalid
        if: ${{ steps.validate-target.outputs.valid == 'false' }}
        env:
          TARGET: ${{ github.base_ref }}
          ALLOWED: ${{ inputs.allowed-target-branches }}
        run: |
          echo "Target branch $TARGET is not in allowed list: $ALLOWED"
          exit 1

      - name: Fail if no conventional commits
        if: ${{ steps.conventional.outputs.has_conventional == 'false' && inputs.require-conventional-commits }}
        run: |
          echo "❌ No conventional commits found in this PR"
          echo ""
          echo "Expected commit message format:"
          echo "  fix: description       → patch bump"
          echo "  feat: description      → minor bump"
          echo "  feat!: description     → major bump"
          echo "  BREAKING CHANGE: text  → major bump"
          echo ""
          echo "Since squash merge is enabled, ensure your PR title follows this format."
          exit 1

  auto-bump-version:
    name: Auto-Bump Version
    needs: check-pr
    if: |
      needs.check-pr.outputs.target_valid == 'true' &&
      needs.check-pr.outputs.has_conventional == 'true' &&
      needs.check-pr.outputs.bump_type != '' &&
      needs.check-pr.outputs.bump_type != 'doc' &&
      needs.check-pr.outputs.should_bump == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.github-token }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch base branch and tags
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Base branch: $BASE_BRANCH"
          git fetch origin "$BASE_BRANCH" --tags

      - name: Get base version for bump
        id: current
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_VERSION_SOURCE: ${{ inputs.base-version-source }}
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          if [ "$BASE_VERSION_SOURCE" = "file" ]; then
            # The version file is what actually gets published, so it is the only
            # base that cannot disagree with the artifact. Tags lag: a merged
            # bump commits version-file=1.7.2 while the newest tag is still
            # v1.7.1, so tag-derived bases recompute 1.7.1 -> 1.7.2 and produce
            # an empty diff. Only an explicit path is accepted here because
            # version-file=auto is resolved inside bump-version, not here.
            if [ -z "$VERSION_FILE" ] || [ "$VERSION_FILE" = "auto" ]; then
              echo "::error::base-version-source 'file' requires an explicit version-file"
              exit 1
            fi
            if [ ! -f "$VERSION_FILE" ]; then
              echo "::error::version file not found: $VERSION_FILE"
              exit 1
            fi
            # bump-version has two writers, so two shapes must be readable. For `ansible` it
            # rewrites the `version:` key; for `generic` — what a file named VERSION
            # or version.txt resolves to — it writes a bare value via `echo > "$FILE"`.
            # A keyed-only read made the base version unresolvable for exactly the
            # files bump-version owns. Keyed is tried first so a galaxy.yml that also
            # contains a bare-looking line cannot win over its real version key.
            VERSION=$(sed -nE "s/^version:[[:space:]]*['\"]?([0-9]+\.[0-9]+\.[0-9]+)['\"]?[[:space:]]*$/\1/p" "$VERSION_FILE" | head -1)
            if [ -z "$VERSION" ]; then
              VERSION=$(sed -nE "s/^[[:space:]]*['\"]?([0-9]+\.[0-9]+\.[0-9]+)['\"]?[[:space:]]*$/\1/p" "$VERSION_FILE" | head -1)
            fi
            if [ -z "$VERSION" ]; then
              echo "::error::no clean X.Y.Z version found in $VERSION_FILE"
              exit 1
            fi
            echo "Base version read from $VERSION_FILE: $VERSION"
          else
            # Highest *release* tag reachable from the base branch. `git describe`
            # is deliberately NOT used: it returns the most RECENT tag by commit
            # distance, so a prerelease tag such as v0.0.0-pr.54 wins over v1.7.1
            # even though it sorts far lower, making the bump roll the version back.
            LATEST_TAG=$(git tag --merged "origin/$BASE_BRANCH" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1 || true)
            if [ -z "$LATEST_TAG" ]; then
              echo "::warning::No release tag found on $BASE_BRANCH — defaulting base version to 0.0.0"
              VERSION="0.0.0"
            else
              VERSION="${LATEST_TAG#v}"
            fi
            echo "Latest release tag on $BASE_BRANCH: ${LATEST_TAG:-<none>} → base version: $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version using custom action
        id: bump
        uses: $/.github/actions/bump-version
        with:
          version-file: ${{ inputs.version-file }}
          bump-type: ${{ needs.check-pr.outputs.bump_type }}
          current-version: ${{ steps.current.outputs.version }}

      - name: Check if changes exist
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version bump detected"
          fi

      - name: Check if last commit was already a version bump
        id: last_commit
        run: |
          LAST_COMMIT=$(git log -1 --pretty=%B)
          if echo "$LAST_COMMIT" | grep -q "chore: bump version"; then
            echo "already_bumped=true" >> "$GITHUB_OUTPUT"
            echo "Last commit was already a version bump, skipping"
          else
            echo "already_bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push version bump
        if: steps.check.outputs.changed == 'true' && steps.last_commit.outputs.already_bumped == 'false'
        env:
          BRANCH: ${{ github.head_ref }}
          BASE_VERSION: ${{ steps.current.outputs.version }}
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          FILE="${{ steps.bump.outputs.version-file }}"
          TYPE="${{ needs.check-pr.outputs.bump_type }}"

          # Fail safe: a bump must only ever move the version FORWARD, and only
          # from a clean release base. A prerelease base (e.g. 0.0.0-pr.54) means
          # the tag lookup went wrong; abort rather than roll an artifact back.
          if ! printf '%s' "$BASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to bump: base version '$BASE_VERSION' is not a clean release version"
            echo "::error::The release-tag lookup returned a prerelease; abort rather than roll a released artifact back."
            exit 1
          fi

          if ! [ "$NEW_VERSION" = "$(printf '%s\n%s\n' "$BASE_VERSION" "$NEW_VERSION" | sort -V | tail -1)" ] \
            || [ "$NEW_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::Refusing version bump $BASE_VERSION → $NEW_VERSION (not a forward move)"
            echo "::error::Check the release tags on the base branch; the bump was derived from a bad base version."
            exit 1
          fi

          git add "$FILE"
          git commit -m "chore: bump version to $NEW_VERSION ($TYPE)"
          git push origin "$BRANCH"
